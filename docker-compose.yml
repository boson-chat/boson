services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: boson
      POSTGRES_PASSWORD: boson
      POSTGRES_DB: boson
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boson -d boson"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - boson-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      ENV: development
      DBHOST: postgres
      DBPORT: 5432
      DBNAME: boson
      DBUSERNAME: boson
      DBPASSWORD: boson
      DBSSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boson-network

  # Local IRC server for E2E tests. Plain TCP on 6667; do not expose externally.
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    ports:
      - '6667:6667'
    volumes:
      - ./infra/ergo/ircd.yaml:/ircd/ircd.yaml:ro
      - ergo_data:/ircd
    # ergo's registration mailto callback delivers to mailpit. Soft
    # dependency: ergo can start without mailpit (it just won't be
    # able to deliver confirmation codes until mailpit is up), so
    # we don't gate on a healthcheck — just start mailpit first.
    depends_on:
      - mailpit
    networks:
      - boson-network
    profiles:
      - testing

  # ---- Anope + UnrealIRCd e2e stack -----------------------------------
  #
  # Only spun up when the e2e-anope profile is explicitly requested:
  #   docker compose --profile e2e-anope up -d
  #
  # Client traffic exposed on host port 6668 so it doesn't collide with
  # the testing-profile Ergo container on 6667. The services link runs
  # on 6900 entirely inside the docker network.
  unrealircd:
    # `ircd/unrealircd` is the community image referenced by
    # https://www.unrealircd.org/docs/Docker — there is no official
    # Unreal-published image. Pinned to `nightly` because that's the
    # only tag the registry actually publishes; the `latest` tag is
    # missing despite docs assuming it.
    image: ircd/unrealircd:nightly
    profiles:
      - e2e-anope
    # Image has no default CMD — run the binary directly in
    # foreground so docker manages the lifecycle. U5 refuses to
    # start without a TLS cert in /ircd/tls/, so we bake throwaway
    # self-signed certs into infra/anope/tls/ and mount them
    # alongside the config. Those certs are CN=irc.test, RSA-2048,
    # expire 100y out — safe to commit.
    command: ["/app/unrealircd/bin/unrealircd", "-F"]
    ports:
      - '6668:6667'
    volumes:
      - ./infra/anope/unrealircd.conf:/ircd/unrealircd.conf:ro
      - ./infra/anope/tls/server.cert.pem:/ircd/tls/server.cert.pem:ro
      - ./infra/anope/tls/server.key.pem:/ircd/tls/server.key.pem:ro
    healthcheck:
      # Services-only port readiness — Anope refuses to link if this
      # port isn't accepting yet. nc is part of the base image.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6900 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - boson-network

  anope:
    image: anope/anope:latest
    profiles:
      - e2e-anope
    volumes:
      - ./infra/anope/conf:/anope/conf:ro
      - anope_data:/anope/data
      # Mount our netcat-based sendmail shim over the path Anope
      # invokes for outbound mail (`sendmailpath` in services.conf).
      # Reroutes confirmation emails to mailpit:1025 without
      # installing extra packages in the image.
      - ./infra/sendmail-shim.sh:/usr/sbin/sendmail:ro
    depends_on:
      unrealircd:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - boson-network

  # ---- Atheme + InspIRCd e2e stack ------------------------------------
  #
  # Pinned to InspIRCd 3.18 (not 4.x) because Atheme 7.2.12 (the
  # version shipped by `ovdnet/atheme:latest`) speaks the InspIRCd 3
  # wire protocol. InspIRCd 4 removed v3 compat — see
  # https://github.com/atheme/atheme/issues/904. Atheme master
  # (post-Nov 2024) fixed this, but no public Docker image ships that
  # build yet.
  #
  # Activated via:  docker compose --profile e2e-atheme up -d
  # Host port: 6669 (client). 7000 internal-only services link.
  inspircd:
    image: inspircd/inspircd-docker:3.18
    profiles:
      - e2e-atheme
    ports:
      - '6669:6667'
    volumes:
      - ./infra/atheme/inspircd.conf:/inspircd/conf/inspircd.conf:ro
    healthcheck:
      # Services-only port readiness — Atheme refuses to link if this
      # port isn't accepting yet. nc is in busybox baseline.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7000 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - boson-network

  atheme:
    image: ovdnet/atheme:latest
    profiles:
      - e2e-atheme
    volumes:
      - ./infra/atheme/atheme.conf:/atheme/etc/atheme.conf:ro
      - atheme_data:/atheme/var
      # Same shim as anope. Atheme's sendmail path is a compile-time
      # default (/usr/sbin/sendmail); mounting our script there
      # routes outbound mail to mailpit:1025.
      - ./infra/sendmail-shim.sh:/usr/sbin/sendmail:ro
    depends_on:
      inspircd:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - boson-network

  # ---- Mailpit (local-dev mailbox for the nickclaim flow) -------------
  #
  # Mailpit accepts SMTP on 1025, serves POP3 on 1110, and a web UI
  # on 8025. The backend's nickclaim POP3 worker talks the same
  # protocol here as it does to PurelyMail in production — same code
  # path, only the env vars differ. (POP3 not IMAP because mailpit
  # doesn't speak IMAP; PurelyMail supports both.)
  #
  # Activated via:  docker compose --profile dev-mail up -d
  # NickServ packages (Anope/Atheme) need to point their outbound
  # mail at mailpit:1025 for the full local end-to-end claim flow.
  mailpit:
    image: axllent/mailpit:latest
    profiles:
      - dev-mail
      - testing
      - e2e-atheme
      - e2e-anope
    ports:
      - '1025:1025'  # SMTP — services packages deliver here
      - '1110:1110'  # POP3 — backend worker reads from here
      - '8025:8025'  # HTTP UI — open http://localhost:8025 to inspect
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      # Enable POP3 + accept any-username/any-password. Mailpit's
      # POP3 server only starts when MP_POP3_AUTH is set; the value
      # is a space-separated list of user:pass pairs. `dev:dev`
      # matches the .env.example defaults so the backend worker
      # connects out of the box.
      MP_POP3_AUTH: 'dev:dev'
    networks:
      - boson-network

  # ---- MinIO (local S3 for the profile-image / avatar feature) --------
  #
  # R2 is S3-compatible, so local dev points the backend's CLOUDFLARE_R2_*
  # config at MinIO instead of real R2 (see backend/config/config.dev.json).
  # The backend runs natively (`make run`) so it reaches MinIO at
  # localhost:9000; the Electron client loads avatars from the same origin
  # (CDN base = http://localhost:9000/boson), which is why the bucket is
  # made anonymously readable below.
  #
  # Activated via:  make minio-up  (folded into `make dev-up`)
  minio:
    image: minio/minio:latest
    profiles:
      - dev-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'  # S3 API — backend PUTs, client GETs avatars
      - '9001:9001'  # web console — http://localhost:9001 (minioadmin/minioadmin)
    volumes:
      - minio_data:/data
    networks:
      - boson-network

  # One-shot: create the `boson` bucket + make it anonymously readable so
  # avatar URLs load directly in the client. Exits 0 once done.
  minio-setup:
    image: minio/mc:latest
    profiles:
      - dev-storage
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/boson;
      mc anonymous set download local/boson;
      echo 'minio bucket ready';
      "
    networks:
      - boson-network

networks:
  boson-network:

volumes:
  postgres_data:
  ergo_data:
  anope_data:
  atheme_data:
  minio_data:
