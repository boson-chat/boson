# Gate every PR + main push on the same checks the pre-commit hook runs
# locally: go vet + go test (the engine; desktop/ is checked in e2e.yml),
# client typecheck + unit tests. E2E (Playwright) is its own workflow
# (e2e.yml). The backend and website have their own repos
# (boson-chat/backend, boson-chat/website) and CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: go mod tidy (verify lockfile is in sync)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  client:
    name: Client (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: typecheck
        working-directory: client
        run: npm run typecheck
      - name: vitest
        working-directory: client
        run: npm test
