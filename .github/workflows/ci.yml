# Gate every PR + main push on the same checks the pre-commit hook runs
# locally: go vet + go test, client/website typecheck + unit tests. E2E
# (Playwright) is intentionally out of scope here — it needs the full
# Supabase + ergo + backend stack and adds ~5 min to every PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet + test)
    runs-on: ubuntu-latest
    # Real Postgres for the repository/integration tests under
    # backend/internal/services/*. testutil/db.go skips DB-backed tests when
    # Postgres is unreachable, but we want them exercised in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boson
          POSTGRES_PASSWORD: boson
          POSTGRES_DB: boson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boson -d boson"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: go mod tidy (verify lockfile is in sync)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      # -p 1 serialises packages because they share the boson_test database.
      - name: go test
        run: go test -p 1 ./...

  client:
    name: Client (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: typecheck
        working-directory: client
        run: npm run typecheck
      - name: vitest
        working-directory: client
        run: npm test

  # Packages the Electron app the way release-client.yml does (unpacked dir,
  # Linux only) so packaging regressions fail the PR instead of the release:
  # v0.31.0 shipped with no installers because electron-builder couldn't
  # resolve the hoisted Electron version.
  package:
    name: Client (electron-builder package smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: build engine sidecar
        run: |
          mkdir -p client/resources/engine
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o client/resources/engine/engine-linux-amd64 ./engine/cmd/engine
      - name: package (unpacked)
        working-directory: client
        run: |
          npm run build
          npx electron-builder --linux dir --x64 --config electron-builder.yml --publish never
      - name: check the packaged app
        working-directory: client/dist/linux-unpacked
        run: |
          test -x boson-client
          test -x resources/engine/engine-linux-amd64
          npx --yes @electron/asar@3.4.1 list "$PWD/resources/app.asar" > asar.txt
          grep -q '^/out/main/index.js$' asar.txt
          grep -q '^/node_modules/electron-updater/package.json$' asar.txt

  website:
    name: Website (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: typecheck
        working-directory: website
        run: npm run typecheck
      - name: build
        working-directory: website
        run: npm run build
