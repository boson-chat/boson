# Builds Electron installers for macOS, Windows, and Linux on every
# v*.*.* tag, then attaches them to the matching GitHub Release. The
# release was opened by .github/workflows/release.yml (semantic-release).
#
# macOS signing + notarization turn on automatically once these repository
# secrets exist (otherwise the build is ad-hoc signed, as before):
#   CSC_LINK            base64 of the "Developer ID Application" .p12
#   CSC_KEY_PASSWORD    the .p12's export password
#   APPLE_API_KEY       contents of the App Store Connect API key (.p8)
#   APPLE_API_KEY_ID    that key's ID
#   APPLE_API_ISSUER    the issuer ID (App Store Connect → Users and Access → Integrations)
# Windows stays unsigned until an Authenticode cert is in place.
name: Release Electron client

on:
  push:
    tags:
      - 'v*.*.*'
  # Lets us re-run a tag's build via `gh workflow run "Release Electron
  # client" --ref vX.Y.Z`. Needed because semantic-release pushes tags
  # using GITHUB_TOKEN, which deliberately does not chain-trigger other
  # workflows — so the tag-triggered run only fires when a human pushes
  # the tag directly.
  workflow_dispatch:

permissions:
  contents: write   # upload assets to the GitHub Release

concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # 'true' only when every macOS signing/notarization secret is present.
      MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: true
      - name: install
        run: npm ci
      # The engine ships inside the Electron app as a sidecar binary —
      # electron-builder picks it up via extraResources in
      # client/electron-builder.yml. On macOS we cross-compile both arches
      # so the same installer build can target Intel + Apple Silicon
      # without rebuilding the engine separately; on Linux/Windows the
      # host arch is the only one we ship.
      - name: build engine sidecar (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p client/resources/engine
          if [ "$RUNNER_OS" = "macOS" ]; then
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o client/resources/engine/engine-darwin-arm64 ./engine/cmd/engine
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o client/resources/engine/engine-darwin-amd64 ./engine/cmd/engine
            # Ad-hoc sign the sidecar binaries. Apple Silicon refuses to
            # exec an unsigned binary (the parent Electron process gets
            # SIGKILL on spawn with no clear error). Ad-hoc signing
            # doesn't need an Apple Developer cert — it just hashes the
            # binary so the kernel can load it. Same identity the main
            # app uses (electron-builder picks identity: '-').
            #
            # We deliberately don't pass `--options runtime` (Hardened
            # Runtime) because that requires a real Developer ID cert
            # to notarise — an ad-hoc identity can't satisfy it. The
            # default (no options) is what we want here.
            codesign --sign - --force --timestamp=none \
              client/resources/engine/engine-darwin-arm64 \
              client/resources/engine/engine-darwin-amd64
          else
            # Linux ships both x64 and arm64; the engine cross-compiles cleanly
            # (CGO off), and electron-builder packages both arches from this runner.
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o client/resources/engine/engine-linux-amd64 ./engine/cmd/engine
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o client/resources/engine/engine-linux-arm64 ./engine/cmd/engine
          fi
      - name: build engine sidecar (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path client/resources/engine | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -o client/resources/engine/engine-windows-amd64.exe ./engine/cmd/engine
      # notarytool takes the App Store Connect key as a file path.
      - name: macOS notarization key
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      # Import the Developer ID cert into a dedicated keychain ourselves.
      # Handing the .p12 to electron-builder (CSC_LINK) fails on the GitHub
      # macOS runners: its temporary keychain can't be unlocked
      # ("SecKeychainUnlock: The user name or passphrase you entered is not
      # correct" from set-key-partition-list). electron-builder then just
      # discovers the identity in the keychain search list.
      - name: macOS signing keychain
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          # Prepend to the user search list so codesign / electron-builder find it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application' \
            || { echo "::error::Developer ID Application identity not found after import"; exit 1; }
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: build installer
        working-directory: client
        env:
          # macOS Developer ID signing — only on the macOS leg and only when
          # the secrets exist: the identity comes from the keychain set up
          # above (auto-discovery). Without them: no keychain discovery, and
          # the afterSign hook ad-hoc signs.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && secrets.APPLE_API_ISSUER || '' }}
          NOTARIZE_FLAG: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' && '-c.mac.notarize=true' || '' }}
          # Vite bakes VITE_* env vars into the renderer bundle at build
          # time, so the released installer connects to the production
          # backend instead of localhost. Engine URL/token aren't set
          # here — those come from the spawned-sidecar discovery flow
          # at runtime (see resources/engine/).
          VITE_BOSON_API_URL: https://api.boson.chat
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Pin the version into the installer so it matches the tag.
          # electron-builder reads version from client/package.json, which
          # semantic-release has already synced via scripts/sync-version.cjs
          # — but the tag-triggered run checks out the tagged commit, so
          # the right value is already on disk. No extra step needed.
        shell: bash
        run: npm run build:installer -- $NOTARIZE_FLAG
      - name: remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
      # Fail the release rather than ship a bundle Gatekeeper would reject.
      - name: verify macOS signature + notarization
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        working-directory: client/dist
        run: |
          for app in mac*/Boson.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Authority=Developer ID Application|flags=.*runtime'
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
            for bin in "$app"/Contents/Resources/engine/engine-darwin-*; do
              codesign --verify --strict --verbose=2 "$bin"
              codesign -dv --verbose=2 "$bin" 2>&1 | grep -E 'flags=.*runtime'
            done
          done
      - name: upload installers to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Match every artifact electron-builder produces, regardless of
          # platform — keep this glob loose so adding a new target above
          # doesn't require updating the workflow. latest*.yml + the
          # blockmap files are the auto-update metadata electron-updater
          # reads at runtime; without them the in-app updater can't see
          # new releases.
          files: |
            client/dist/*.dmg
            client/dist/*.zip
            client/dist/*.exe
            client/dist/*.AppImage
            client/dist/*.deb
            client/dist/latest*.yml
            client/dist/*.blockmap
          fail_on_unmatched_files: false
