# Runs semantic-release on every push to main. Conventional-commit messages
# determine the bump (feat → minor, fix → patch). semantic-release writes
# CHANGELOG.md, syncs the version into every package.json via
# scripts/sync-version.cjs, commits the bump back to main with [skip ci],
# pushes a tag (vX.Y.Z), and creates the GitHub Release.
#
# Tagging is the trigger for the downstream artifact workflows
# (release-docker, release-client) — they publish to the GitHub Release
# this workflow just opened. No coordination via inputs/outputs needed.
name: Release

on:
  push:
    branches: [main]

# Don't double-publish if main updates while a release is mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # commit CHANGELOG + push tag
  issues: write         # comment on closed issues
  pull-requests: write  # comment on merged PRs
  id-token: write       # provenance (future-proof for npm publish)
  actions: write        # `gh workflow run` the downstream tag builds

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip the release loop on the commits semantic-release itself pushed
    # — they carry "[skip ci]" in the subject but we also gate explicitly
    # in case someone uses that string for unrelated reasons.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs full history to walk commits since the
          # last tag.
          fetch-depth: 0
          # Use a PAT (or rely on the default GITHUB_TOKEN — the workflow's
          # `contents: write` perm is sufficient for pushing to main).
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Install only the root deps (semantic-release + its plugins). We do
      # NOT need to install the workspaces here because semantic-release
      # only touches package.json metadata + the changelog.
      - name: install
        run: npm ci --ignore-scripts
      # Capture the latest tag *before* semantic-release runs so we can
      # detect whether a new tag was actually published. Plain commits
      # (chore:, docs:) don't produce a release — when that happens the
      # post-tag matches and we skip the downstream dispatch.
      - name: latest tag (pre)
        id: tag_pre
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      # Re-read the latest tag. semantic-release pushes via GITHUB_TOKEN,
      # which deliberately doesn't chain-trigger `push: tags` workflows
      # (a GitHub-Actions safety to prevent infinite recursion). So if a
      # tag was just cut, we have to dispatch the downstream artifact
      # builds ourselves.
      - name: latest tag (post)
        id: tag_post
        run: |
          git fetch --tags --quiet
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - name: Dispatch tag-triggered workflows
        if: steps.tag_post.outputs.tag != steps.tag_pre.outputs.tag && steps.tag_post.outputs.tag != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag_post.outputs.tag }}
        run: |
          set -e
          echo "Dispatching downstream builds for $NEW_TAG"
          gh workflow run "Release Electron client" --ref "$NEW_TAG"
          gh workflow run "Release Docker images"   --ref "$NEW_TAG"
