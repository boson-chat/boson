# The web client (chat.boson.chat): harbor.floret.dev/boson/web, built from
# infra/web/Dockerfile (the renderer's web build + the engine as
# WebAssembly, served by nginx). Pull requests build the image and check
# what it serves; a release tag (dispatched by release.yml, like the
# desktop builds) publishes it as :<version> and :latest.
name: Web app

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'engine/**'
      - 'packages/**'
      - 'infra/web/**'
      - 'go.mod'
      - 'go.sum'
      - 'package-lock.json'
      - '.github/workflows/web.yml'
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: harbor.floret.dev/boson/web

jobs:
  image:
    name: Web image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@v3
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: Build (local, amd64)
        run: docker buildx build --load -f infra/web/Dockerfile --build-arg VERSION=${{ steps.v.outputs.version }} -t boson-web:ci .
      - name: Serves the app with its headers
        run: |
          set -euo pipefail
          docker run -d --name web -p 127.0.0.1:8080:8080 -e BOSON_AUTH_URL=https://auth.example.test boson-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8080/ | tee h.txt
          grep -qi "content-security-policy: default-src 'self'; script-src 'self' 'wasm-unsafe-eval'" h.txt
          grep -qi 'content-type: text/html' h.txt
          curl -fsS http://127.0.0.1:8080/boson-config.js | tee c.txt
          grep -q '"https://auth.example.test"' c.txt
          curl -fsS http://127.0.0.1:8080/join?host=irc.example.net | grep -q 'boson-config.js'
          curl -fsS http://127.0.0.1:8080/sso/callback | grep -q 'sso-callback.js'
          wasm=$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -fsSI "http://127.0.0.1:8080$wasm" | grep -qi 'immutable'
          docker exec web sh -c 'ls /usr/share/nginx/html/assets/*.wasm' | head -1 | xargs -I{} basename {} > wasm.txt
          curl -fsSI "http://127.0.0.1:8080/assets/$(cat wasm.txt)" | grep -qi 'content-type: application/wasm'
          docker logs web
      - name: Publish (release tags)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$HARBOR_PASSWORD" | docker login harbor.floret.dev -u "$HARBOR_USERNAME" --password-stdin
          v=${{ steps.v.outputs.version }}
          tags="-t $IMAGE:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags -t $IMAGE:$v -t $IMAGE:latest"; fi
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push \
            -f infra/web/Dockerfile --build-arg VERSION="$v" $tags .
