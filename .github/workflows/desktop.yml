# Builds the desktop app (desktop/, Wails) for macOS, Windows and Linux:
#
#   macOS    universal (arm64 + amd64) Boson.app in a DMG, Developer ID
#            signed with the hardened runtime, notarized and stapled
#            (desktop/scripts/package-macos.sh)
#   Windows  Boson.exe (icon + version info embedded) in a zip, unsigned
#            until an Authenticode certificate is in place
#   Linux    the binary + .desktop entry + icon in a tar.gz (GTK 4 /
#            WebKitGTK 6.0)
#            (both: desktop/scripts/package.sh)
#
# Every run uploads them as workflow artifacts (`boson-desktop-<os>`). On a
# release tag (vX.Y.Z: pushed, or dispatched by release.yml, since
# semantic-release's tag push doesn't trigger workflows) the publish job
# also attaches them to that GitHub Release under fixed names, which the
# website's download links point at (…/releases/latest/download/<name>):
#   Boson-mac-universal.dmg, Boson-windows-x64.zip, Boson-linux-x86_64.tar.gz
#
# macOS signing secrets: CSC_LINK (base64 of the "Developer ID Application"
# .p12), CSC_KEY_PASSWORD, APPLE_API_KEY (the App Store Connect .p8's
# contents), APPLE_API_KEY_ID, APPLE_API_ISSUER. Without them (forks,
# Dependabot) the build is ad-hoc signed and not notarized, and a release
# fails rather than publish it.
name: Desktop app

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'client/**'
      - 'engine/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    tags: ['v*.*.*']
  # Re-run a tag's build: `gh workflow run "Desktop app" --ref vX.Y.Z`
  # (release.yml does this for every release).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release build half way.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # 'true' only when every macOS signing/notarization secret is present.
      MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      # Vite bakes these into the renderer: the production backend.
      VITE_BOSON_API_URL: https://api.boson.chat
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: install
        run: npm ci

      # ---- macOS ------------------------------------------------------------

      - name: macOS notarization key
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # The Developer ID cert in a dedicated keychain. (Handing the .p12 to a
      # tool's own temporary keychain fails on GitHub's macOS runners: it
      # can't be unlocked.)
      - name: macOS signing keychain
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application' \
            || { echo "::error::Developer ID Application identity not found after import"; exit 1; }
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: build (macOS)
        if: runner.os == 'macOS'
        env:
          # Ad hoc without the secrets; package-macos.sh otherwise finds the
          # Developer ID identity in the keychain above.
          SIGN_IDENTITY: ${{ env.MAC_SIGNING != 'true' && '-' || '' }}
          APPLE_API_KEY_ID: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: desktop/scripts/package-macos.sh

      - name: remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

      # Fail rather than hand out a bundle Gatekeeper would reject.
      - name: verify macOS signature + notarization
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        working-directory: desktop/bin
        run: |
          codesign --verify --strict --verbose=2 Boson.app
          codesign -dv --verbose=2 Boson.app 2>&1 | grep -E 'Authority=Developer ID Application|flags=.*runtime'
          spctl --assess --type execute --verbose=4 Boson.app
          xcrun stapler validate Boson.app
          for dmg in *.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      # ---- Windows ----------------------------------------------------------

      # The wails3 CLI embeds the icon, version info and manifest (.syso).
      - name: wails3 CLI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: desktop/scripts/package.sh

      # ---- Linux ------------------------------------------------------------

      - name: GTK 4 + WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: build (Linux)
        if: runner.os == 'Linux'
        run: desktop/scripts/package.sh

      # ---- all --------------------------------------------------------------

      # A release must ship signed and notarized.
      - name: release needs the signing secrets
        if: runner.os == 'macOS' && github.ref_type == 'tag' && env.MAC_SIGNING != 'true'
        run: |
          echo "::error::Release builds need the macOS signing/notarization secrets"
          exit 1

      - name: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boson-desktop-${{ runner.os }}
          path: |
            desktop/bin/*.dmg
            desktop/bin/*.zip
            desktop/bin/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  # Attach the builds to the GitHub Release semantic-release opened for this
  # tag, under the version-free names the website links to.
  publish:
    name: attach to the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: boson-desktop-*
          path: dist
          merge-multiple: true
      - name: fixed names
        run: |
          set -euo pipefail
          ls -la dist
          mkdir release
          cp dist/*-mac-universal.dmg release/Boson-mac-universal.dmg
          cp dist/*-windows-amd64.zip release/Boson-windows-x64.zip
          cp dist/*-linux-amd64.tar.gz release/Boson-linux-x86_64.tar.gz
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: upload to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
