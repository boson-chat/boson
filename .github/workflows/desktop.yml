# Builds the app (desktop/, Wails) for macOS, Windows, Linux and Android:
#
#   macOS    Boson.app in a DMG per architecture (Apple Silicon, Intel),
#            Developer ID signed with the hardened runtime, notarized and
#            stapled
#            (desktop/scripts/package-macos.sh)
#   Windows  Boson.exe (icon + version info embedded) in a zip, unsigned
#            until an Authenticode certificate is in place
#   Linux    the binary + .desktop entry + icon in a tar.gz (GTK 4 /
#            WebKitGTK 6.0)
#            (both: desktop/scripts/package.sh)
#   Android  a sideloadable APK (arm64), signed with our release key
#            (desktop/scripts/package-android.sh)
#   iOS      a development-signed IPA + itms-services manifest for the
#            registered test iPhones (desktop/scripts/package-ios.sh,
#            ios_ota.py; optional, see the ios job and docs/ios-release.md)
#
# Every run uploads them as workflow artifacts (`boson-desktop-<os>`). On a
# release tag (vX.Y.Z: pushed, or dispatched by release.yml, since
# semantic-release's tag push doesn't trigger workflows) the publish job
# also attaches them to that GitHub Release under fixed names, which the
# website's download links point at (…/releases/latest/download/<name>):
#   Boson-mac-arm64.dmg, Boson-mac-x64.dmg, Boson-windows-x64.zip,
#   Boson-linux-x86_64.tar.gz, Boson-android.apk, Boson-ios.ipa and
#   Boson-ios.plist (when built)
# plus what the in-app updater (desktop/internal/selfupdate) reads:
#   Boson-mac-arm64.app.zip, Boson-mac-x64.app.zip (the stapled .app),
#   update-manifest.json (per platform: payload name, size, sha256; the
#   version and the oldest version that may update in place) and
#   update-manifest.json.sig (its ed25519 signature), and SHA256SUMS.txt.
#
# Update signing secret: UPDATE_SIGNING_KEY (PKCS#8 PEM ed25519 private key;
# its public half is in desktop/internal/selfupdate/keys.go). Without it
# (forks) there's no manifest, and installed copies offer the release page
# instead of updating in place.
#
# macOS signing secrets: CSC_LINK (base64 of the "Developer ID Application"
# .p12), CSC_KEY_PASSWORD, APPLE_API_KEY (the App Store Connect .p8's
# contents), APPLE_API_KEY_ID, APPLE_API_ISSUER. Without them (forks,
# Dependabot) the build is ad-hoc signed and not notarized, and a release
# fails rather than publish it.
#
# Voice links libopus statically, built from source per platform/
# architecture by desktop/scripts/build-opus.sh (cached; for Android with
# the NDK), and needs cgo everywhere: Windows builds with MSYS2's MinGW-w64
# gcc. The quicvoice SDK (github.com/boson-chat/quicvoice) is a public Go
# module.
#
# Android signing secrets: ANDROID_KEYSTORE (base64 of the release keystore),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without
# them the APK is signed with a throwaway debug key, and a release leaves the
# APK out: one signed with another key can't update an installed copy.
name: Desktop app

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'client/**'
      - 'engine/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    tags: ['v*.*.*']
  # Re-run a tag's build: `gh workflow run "Desktop app" --ref vX.Y.Z`
  # (release.yml does this for every release).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release build half way.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS signs and notarizes two architectures with Apple's notary
    # service, which occasionally stalls (package-macos.sh retries it).
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 40 }}
    env:
      # 'true' only when every macOS signing/notarization secret is present.
      MAC_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      # Vite bakes these into the renderer: the production backend and
      # auth service.
      VITE_BOSON_API_URL: https://api.boson.chat
      VITE_AUTH_URL: https://auth.boson.chat
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum


      - name: install
        run: npm ci

      # Static libopus for voice (desktop/scripts/build-opus.sh), per OS/arch.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: desktop/build/.opus
          key: opus-${{ runner.os }}-${{ hashFiles('desktop/scripts/build-opus.sh') }}

      # ---- macOS ------------------------------------------------------------

      # pkg-config finds the static libopus; cmake builds it.
      - name: macOS voice build tools
        if: runner.os == 'macOS'
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          command -v cmake >/dev/null || brew install cmake

      - name: macOS notarization key
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # The Developer ID cert in a dedicated keychain. (Handing the .p12 to a
      # tool's own temporary keychain fails on GitHub's macOS runners: it
      # can't be unlocked.)
      - name: macOS signing keychain
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application' \
            || { echo "::error::Developer ID Application identity not found after import"; exit 1; }
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: build (macOS)
        if: runner.os == 'macOS'
        env:
          # Ad hoc without the secrets; package-macos.sh otherwise finds the
          # Developer ID identity in the keychain above.
          SIGN_IDENTITY: ${{ env.MAC_SIGNING != 'true' && '-' || '' }}
          APPLE_API_KEY_ID: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: desktop/scripts/package-macos.sh

      - name: remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

      # Fail rather than hand out a bundle Gatekeeper would reject.
      - name: verify macOS signature + notarization
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        working-directory: desktop/bin
        run: |
          for arch in arm64 x64; do
            app="mac-$arch/Boson.app"
            codesign --verify --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Authority=Developer ID Application|flags=.*runtime'
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
          # Each holds only its own architecture.
          lipo -archs mac-arm64/Boson.app/Contents/MacOS/Boson | grep -qx arm64
          lipo -archs mac-x64/Boson.app/Contents/MacOS/Boson | grep -qx x86_64
          for dmg in *.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      # ---- Windows ----------------------------------------------------------

      # The wails3 CLI embeds the icon, version info and manifest (.syso).
      - name: wails3 CLI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # cgo (voice: miniaudio, libopus) needs a C toolchain: MinGW-w64 gcc,
      # with cmake/ninja/pkgconf to build and find the static libopus.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf

      - name: MinGW-w64 on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: cygpath -w "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      - name: build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gcc --version | head -1
          desktop/scripts/package.sh

      # ---- Linux ------------------------------------------------------------

      # cmake + pkg-config: the static libopus for voice.
      - name: GTK 4 + WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev cmake pkg-config

      - name: build (Linux)
        if: runner.os == 'Linux'
        run: desktop/scripts/package.sh

      # ---- all --------------------------------------------------------------

      # A release must ship signed and notarized.
      - name: release needs the signing secrets
        if: runner.os == 'macOS' && github.ref_type == 'tag' && env.MAC_SIGNING != 'true'
        run: |
          echo "::error::Release builds need the macOS signing/notarization secrets"
          exit 1

      # The updater's verification, swap and relaunch code on this OS (it's
      # pure Go; the Linux run is in e2e.yml with the rest of the shell).
      - name: updater tests
        if: runner.os != 'Linux'
        shell: bash
        working-directory: desktop
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./internal/selfupdate/

      - name: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boson-desktop-${{ runner.os }}
          path: |
            desktop/bin/*.dmg
            desktop/bin/*.zip
            desktop/bin/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      VITE_BOSON_API_URL: https://api.boson.chat
      VITE_AUTH_URL: https://auth.boson.chat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      # Gradle 9 runs on 17+. The runner image has the Android SDK
      # ($ANDROID_HOME) and NDKs ($ANDROID_NDK_LATEST_HOME).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: install
        run: npm ci

      # Static libopus for voice, cross-compiled with the NDK
      # (desktop/scripts/build-opus.sh android-arm64); cmake is on the image.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: desktop/build/.opus
          key: opus-android-${{ hashFiles('desktop/scripts/build-opus.sh') }}

      - name: Android voice build tools
        run: command -v pkg-config >/dev/null || (sudo apt-get update && sudo apt-get install -y pkg-config)

      - name: Android signing key
        if: env.ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$ks"
          echo "ANDROID_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"

      - name: build (Android)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" desktop/scripts/package-android.sh

      - name: remove Android signing key
        if: always() && env.ANDROID_KEYSTORE_FILE != ''
        run: rm -f "$ANDROID_KEYSTORE_FILE"

      # Signed with the release key, or not shipped.
      - name: verify APK signature
        if: env.ANDROID_SIGNING == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs desktop/bin/android/*.apk)"
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi

      - name: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Release-signed builds only join the release (publish).
          name: ${{ env.ANDROID_SIGNING == 'true' && 'boson-desktop-Android' || 'boson-android-debug' }}
          path: desktop/bin/android/*.apk
          retention-days: 14
          if-no-files-found: error

  # The iOS push extension's decrypt / parsing / filtering (Swift, run on
  # the Mac; desktop/build/ios/push/tests). No signing needed.
  ios-push-tests:
    name: iOS push extension tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: desktop/scripts/test-ios-push.sh

  # A development-signed iPhone build for over-the-air install on the
  # devices its provisioning profile lists: Boson-ios.ipa plus the
  # itms-services manifest Boson-ios.plist (desktop/scripts/package-ios.sh,
  # ios_ota.py). release-assets attaches both to a release; a phone installs
  # with itms-services://?action=download-manifest&url=https://github.com/
  # <repo>/releases/download/vX.Y.Z/Boson-ios.plist (docs/ios-release.md).
  #
  # Secrets: IOS_SIGNING_CERT_P12_BASE64 + IOS_SIGNING_CERT_PASSWORD (an
  # "Apple Development" identity; the Developer ID one in CSC_LINK can't
  # sign for iOS), and the profile from IOS_PROVISIONING_PROFILE_BASE64 or,
  # without it, an existing active development profile fetched read-only
  # from the App Store Connect API with the APPLE_API_* key
  # (ios_fetch_profile.py). Missing secrets or no usable profile: a notice
  # and a skip. Optional in every way: its failing never holds back a
  # release (continue-on-error, and release-assets doesn't need it to pass).
  ios:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      IOS_CERT_SET: ${{ secrets.IOS_SIGNING_CERT_P12_BASE64 != '' && secrets.IOS_SIGNING_CERT_PASSWORD != '' }}
      IOS_PROFILE_SET: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
      ASC_API_SET: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      # The team and app id the profile must cover (desktop/build/ios/Device.entitlements).
      IOS_TEAM: FJY7UPX884
      IOS_BUNDLE_ID: chat.boson.app
      VITE_BOSON_API_URL: https://api.boson.chat
      VITE_AUTH_URL: https://auth.boson.chat
    steps:
      # IOS_BUILD gates every later step; any step may turn it off (skip).
      - name: iOS signing secrets
        run: |
          if [ "$IOS_CERT_SET" != true ]; then
            echo "::notice title=iOS build skipped::IOS_SIGNING_CERT_P12_BASE64 / IOS_SIGNING_CERT_PASSWORD are not set: no Boson-ios.ipa (docs/ios-release.md)"
            echo "IOS_BUILD=false" >> "$GITHUB_ENV"
          elif [ "$IOS_PROFILE_SET" != true ] && [ "$ASC_API_SET" != true ]; then
            echo "::notice title=iOS build skipped::No IOS_PROVISIONING_PROFILE_BASE64 and no APPLE_API_* key to fetch the profile with: no Boson-ios.ipa (docs/ios-release.md)"
            echo "IOS_BUILD=false" >> "$GITHUB_ENV"
          else
            echo "IOS_BUILD=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.IOS_BUILD == 'true'

      # The Apple Development cert in a dedicated keychain, as for macOS
      # above, with Apple's WWDR G3 intermediate so the chain validates.
      - name: iOS signing keychain
        if: env.IOS_BUILD == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/ios-development.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$keychain"
          echo "IOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          if ! security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; then
            rm -f "$p12"
            echo "::warning title=iOS build skipped::IOS_SIGNING_CERT_P12_BASE64 didn't import (wrong IOS_SIGNING_CERT_PASSWORD, or not a base64 .p12)"
            echo "IOS_BUILD=false" >> "$GITHUB_ENV"
            exit 0
          fi
          rm -f "$p12"
          wwdr="$RUNNER_TEMP/AppleWWDRCAG3.cer"
          if curl -fsSL --max-time 60 -o "$wwdr" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer; then
            security import "$wwdr" -k "$keychain" || true
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sha1="$(security find-identity -v -p codesigning "$keychain" | awk '/Apple Development/ { print $2; exit }')"
          if [ -z "$sha1" ]; then
            echo "::warning title=iOS build skipped::No valid Apple Development identity in IOS_SIGNING_CERT_P12_BASE64"
            security find-identity -p codesigning "$keychain" || true
            echo "IOS_BUILD=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "IOS_IDENTITY=$sha1" >> "$GITHUB_ENV"

      - name: iOS provisioning profile (secret)
        if: env.IOS_BUILD == 'true' && env.IOS_PROFILE_SET == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/boson.mobileprovision"
          echo "IOS_PROFILE=$RUNNER_TEMP/boson.mobileprovision" >> "$GITHUB_ENV"

      # Read-only: one GET of /v1/profiles. Nothing is created or changed.
      - name: iOS provisioning profile (App Store Connect, read-only)
        if: env.IOS_BUILD == 'true' && env.IOS_PROFILE_SET != 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -uo pipefail
          key="$RUNNER_TEMP/AuthKey-ios.p8"
          ( umask 077; printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key" )
          rc=0
          APPLE_API_KEY="$key" python3 desktop/scripts/ios_fetch_profile.py \
            --out "$RUNNER_TEMP/boson.mobileprovision" --cert-sha1 "$IOS_IDENTITY" || rc=$?
          rm -f "$key"
          if [ "$rc" -ne 0 ]; then
            echo "::notice title=iOS build skipped::No active development profile for $IOS_BUNDLE_ID (or the team wildcard) listing the signing certificate in App Store Connect; set IOS_PROVISIONING_PROFILE_BASE64 (docs/ios-release.md)"
            echo "IOS_BUILD=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "IOS_PROFILE=$RUNNER_TEMP/boson.mobileprovision" >> "$GITHUB_ENV"

      # It must cover the team + app id, list the certificate and not have
      # expired; then it's installed where Xcode's tools look for profiles.
      - name: check + install the profile
        if: env.IOS_BUILD == 'true'
        run: |
          set -euo pipefail
          plist="$RUNNER_TEMP/boson-profile.plist"
          # (openssl, not `security cms`, which imports the signer's certs.)
          openssl smime -inform der -verify -noverify -in "$IOS_PROFILE" -out "$plist" 2>/dev/null
          if ! python3 - "$plist" <<'PY'
          import datetime, hashlib, os, plistlib, sys
          p = plistlib.load(open(sys.argv[1], "rb"))
          team, bundle, cert = os.environ["IOS_TEAM"], os.environ["IOS_BUNDLE_ID"], os.environ["IOS_IDENTITY"]
          appid = p["Entitlements"]["application-identifier"]
          problems = []
          if appid not in (f"{team}.{bundle}", f"{team}.*"):
              problems.append(f"app id {appid}, not {team}.{bundle} or {team}.*")
          if p["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              problems.append(f"expired {p['ExpirationDate']:%Y-%m-%d}")
          if cert not in {hashlib.sha1(c).hexdigest().upper() for c in p.get("DeveloperCertificates", [])}:
              problems.append("doesn't list the signing certificate")
          if not p.get("ProvisionedDevices"):
              problems.append("lists no devices")
          print(f"profile {p['Name']!r}: {appid}, {len(p.get('ProvisionedDevices', []))} devices, expires {p['ExpirationDate']:%Y-%m-%d}")
          for m in problems:
              print(f"::warning title=iOS build skipped::Provisioning profile: {m}")
          sys.exit(1 if problems else 0)
          PY
          then
            echo "IOS_BUILD=false" >> "$GITHUB_ENV"
            exit 0
          fi
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          cp "$IOS_PROFILE" "$dir/$uuid.mobileprovision"
          echo "IOS_PROFILE_INSTALLED=$dir/$uuid.mobileprovision" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.IOS_BUILD == 'true'
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: env.IOS_BUILD == 'true'
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: install
        if: env.IOS_BUILD == 'true'
        run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.IOS_BUILD == 'true'
        with:
          path: desktop/build/.opus
          key: opus-ios-${{ hashFiles('desktop/scripts/build-opus.sh') }}

      - name: iOS voice build tools
        if: env.IOS_BUILD == 'true'
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          command -v cmake >/dev/null || brew install cmake

      # The manifest points at this version's release download URL (on a
      # PR or main that's the last release's tag: a workflow artifact only).
      - name: build (iOS device) + IPA
        if: env.IOS_BUILD == 'true'
        run: |
          set -euo pipefail
          version="$(node -p "require('./client/package.json').version")"
          IOS_PLATFORM=device \
          PROVISIONING_PROFILE="$IOS_PROFILE" \
          CODESIGN_IDENTITY="$IOS_IDENTITY" \
          CODESIGN_KEYCHAIN="$IOS_KEYCHAIN" \
          IPA_OUT="$GITHUB_WORKSPACE/desktop/bin/ios-release" \
          IPA_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version" \
            desktop/scripts/package-ios.sh

      - name: verify the IPA
        if: env.IOS_BUILD == 'true'
        working-directory: desktop/bin
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 ios-device/Boson.app
          codesign -dv --verbose=2 ios-device/Boson.app 2>&1 | grep -E 'Authority=Apple Development'
          unzip -l ios-release/Boson-ios.ipa | grep -q ' Payload/Boson.app/Boson$'
          unzip -l ios-release/Boson-ios.ipa | grep -q ' Payload/Boson.app/embedded.mobileprovision$'
          plutil -lint ios-release/Boson-ios.plist
          cat ios-release/Boson-ios.plist

      - name: remove iOS signing keychain + profile
        if: always()
        run: |
          [ -n "${IOS_KEYCHAIN:-}" ] && security delete-keychain "$IOS_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/ios-development.p12" "$RUNNER_TEMP/AuthKey-ios.p8" "${IOS_PROFILE:-}" "${IOS_PROFILE_INSTALLED:-}"

      - name: upload
        if: env.IOS_BUILD == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # release-assets picks up boson-desktop-*.
          name: boson-desktop-iOS
          path: |
            desktop/bin/ios-release/Boson-ios.ipa
            desktop/bin/ios-release/Boson-ios.plist
          retention-days: 14
          if-no-files-found: error

  # The release's files under the version-free names the website links to,
  # the signed update manifest and SHA256SUMS.txt — on every run, so a PR
  # exercises the manifest and its signing too. The APK joins when the
  # Android job built a release-signed one; its failing doesn't hold back
  # the desktop builds.
  release-assets:
    name: release assets + update manifest
    needs: [build, android, ios]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      # The oldest version that may update to this release in place; older
      # copies are sent to the release page. Raise it when a release can't
      # be installed over older ones (a changed bundle id, data format, …).
      UPDATE_MIN_VERSION: '0.57.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: boson-desktop-*
          path: dist
          merge-multiple: true
      - name: fixed names
        run: |
          set -euo pipefail
          ls -la dist
          mkdir release
          cp dist/*-mac-arm64.dmg release/Boson-mac-arm64.dmg
          cp dist/*-mac-x64.dmg release/Boson-mac-x64.dmg
          cp dist/*-mac-arm64.app.zip release/Boson-mac-arm64.app.zip
          cp dist/*-mac-x64.app.zip release/Boson-mac-x64.app.zip
          cp dist/*-windows-amd64.zip release/Boson-windows-x64.zip
          cp dist/*-linux-amd64.tar.gz release/Boson-linux-x86_64.tar.gz
          if ls dist/*-android.apk >/dev/null 2>&1; then
            cp dist/*-android.apk release/Boson-android.apk
          else
            echo "::warning::No release-signed APK: the release goes out without Android"
          fi
          # The iOS job's IPA + OTA manifest, when it built them. Not in the
          # update manifest (iOS has no in-app update); in SHA256SUMS.txt.
          if [ -f dist/Boson-ios.ipa ] && [ -f dist/Boson-ios.plist ]; then
            cp dist/Boson-ios.ipa dist/Boson-ios.plist release/
          else
            echo "::notice::No Boson-ios.ipa: the release goes out without the iOS build"
          fi
      - name: update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::No UPDATE_SIGNING_KEY: no update manifest; installed copies will offer the release page"
            exit 0
          fi
          version="$(node -p "require('./client/package.json').version")"
          desktop/scripts/update-manifest.py release "$version" "$UPDATE_MIN_VERSION" > release/update-manifest.json
          cat release/update-manifest.json
          key="$RUNNER_TEMP/update-signing.pem"
          ( umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key" )
          trap 'rm -f "$key"' EXIT
          REQUIRE_EMBEDDED_KEY=1 desktop/scripts/sign-update-manifest.sh "$key" release/update-manifest.json
      - name: checksums
        run: (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boson-release
          path: release/*
          retention-days: 14
          if-no-files-found: error

  # Attach the release assets to the GitHub Release semantic-release opened
  # for this tag.
  publish:
    name: attach to the release
    needs: [release-assets]
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: boson-release
          path: release
      # The manifest goes up last: a copy that sees it can then download
      # everything it lists.
      - name: hold back the manifest
        run: |
          mkdir manifest
          mv release/update-manifest.json* manifest/ 2>/dev/null || echo "::warning::No update manifest in this release"
      - name: upload to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
      - name: upload the update manifest
        if: ${{ hashFiles('manifest/update-manifest.json') != '' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            manifest/update-manifest.json
            manifest/update-manifest.json.sig
          fail_on_unmatched_files: true
