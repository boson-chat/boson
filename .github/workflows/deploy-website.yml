# Builds the marketing site (website/) and deploys it to the existing
# Cloudflare Worker `boson-chat` using the Workers Static Assets feature
# (configured in website/wrangler.toml). The custom domain attached to
# that Worker stays in place — no DNS changes required between releases.
#
# Required secrets:
#   - CLOUDFLARE_API_TOKEN  : API token with "Workers Scripts — Edit"
#                             (Account scope) + "User Details — Read".
#                             A token created with only "Pages — Edit"
#                             will fail; the deploy is a Workers deploy.
#   - CLOUDFLARE_ACCOUNT_ID : 32-char hex account ID (no dashes), copy
#                             from the dash.cloudflare.com URL after
#                             logging in.
name: Deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # wrangler's preview-deploy comment needs write access on PRs.
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: build
        working-directory: website
        run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          # `wrangler deploy` (no subcommand) uploads the Worker described
          # by website/wrangler.toml — for us that's a Workers Static
          # Assets bundle pointing at website/dist. Non-main branches
          # land as preview-version deployments under boson-chat-<hash>.
          command: deploy
