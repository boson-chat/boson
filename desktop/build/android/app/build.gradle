plugins {
    id 'com.android.application'
}

// Push notifications through FCM (docs/push-android.md): on when
// app/google-services.json is there (the Firebase project's config), or
// -PbosonFcm=1 (compiles the FCM sources; without the json Firebase can't
// start at run time, so that's for checking builds). Off: the APK is built
// as before and push shows as unavailable.
def bosonGoogleServices = file('google-services.json').exists()
def bosonFcm = bosonGoogleServices || project.findProperty('bosonFcm') == '1'
// Play Integrity's cloud project number (-PbosonCloudProject= or
// BOSON_CLOUD_PROJECT); 0 = the app's linked project.
def bosonCloudProject = (project.findProperty('bosonCloudProject') ?: System.getenv('BOSON_CLOUD_PROJECT') ?: '0').toString()
if (bosonGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "chat.boson.app"
        minSdk 26
        targetSdk 35
        // From client/package.json, passed by scripts/package-android.sh.
        versionCode Integer.parseInt((project.findProperty('bosonVersionCode') ?: '1').toString())
        versionName((project.findProperty('bosonVersionName') ?: '0.0.0').toString())
        // Dev builds (package-android.sh DEV=1): the WebView can be
        // inspected (Chrome DevTools, the Android call test's Playwright).
        buildConfigField "boolean", "WEBVIEW_DEBUG", (project.findProperty('bosonDev') == '1').toString()
        // Push (BosonPush): whether FcmBackend / BosonPushService are in.
        buildConfigField "boolean", "BOSON_FCM", bosonFcm.toString()
        buildConfigField "long", "BOSON_CLOUD_PROJECT", "${bosonCloudProject}L"
        manifestPlaceholders = [
            bosonPushService: bosonFcm ? '.BosonPushService' : '.BosonPushStub',
            bosonPushEnabled: bosonFcm.toString(),
        ]

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // FCM receiver + backend (push), only with Firebase.
            if (bosonFcm) java.srcDirs += 'src/fcm/java'
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    if (bosonFcm) {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-messaging'
        implementation 'com.google.android.play:integrity:1.4.0'
    }
}
