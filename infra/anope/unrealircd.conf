// Minimal UnrealIRCd 6 config for e2e tests. Plaintext-only, ephemeral,
// not for production use. Pairs with infra/anope/conf/services.conf via
// the shared linkpass below.
//
// Run via: `docker compose --profile e2e-anope up -d`
// Host ports: 6668 (client) — 6900 stays inside the docker network.
//
// Source references in case the config drifts on Unreal upgrades:
//   https://www.unrealircd.org/docs/Linking_UnrealIRCd_with_anope
//   https://github.com/unrealircd/unrealircd-docs/blob/main/docs/Anope_and_UnrealIRCd.md

// Required-module includes. UnrealIRCd's binary doesn't ship with
// efunctions linked in — the protocol guts live in modules that the
// daemon dlopen()s at startup. Without these the config fails with
// "efunction 'do_join' not found" + friends.
include "modules.default.conf";

me {
    name "irc.test";
    info "boson e2e ircd";
    sid "001";
};

admin {
    "boson-e2e";
};

class clients {
    pingfreq 90;
    maxclients 100;
    sendq 200k;
    recvq 8000;
};

class servers {
    pingfreq 60;
    connfreq 15;
    maxclients 10;
    sendq 1M;
};

allow {
    ip *;
    class clients;
    maxperip 50;
};

// Client port. Container-internal :6667 maps to host :6668 (see
// docker-compose.yml e2e-anope profile) so it doesn't collide with
// the testing-profile Ergo container on 6667.
listen {
    ip *;
    port 6667;
};

// U5 refuses to start without at least one TLS listener configured,
// even if no client ever uses it. We bind 6697 inside the container
// only — the host-side mapping (6668→6667) doesn't expose it, so
// nothing external can reach the dummy-cert TLS port.
listen {
    ip *;
    port 6697;
    options { tls; };
};

// Services link port. Servers-only — clients can't connect here.
listen {
    ip *;
    port 6900;
    options { serversonly; };
};

// Allow the Anope container to link in. Password is shared with
// services.conf:uplink.password — change in BOTH or services won't
// link.
link services.test {
    incoming { mask *; };
    password "linkpass";
    class servers;
};

// Anope is a U-line — it can override channel + nick modes the IRCd
// would otherwise restrict.
ulines {
    services.test;
};

set {
    kline-address "noreply@test.invalid";
    network-name "boson-e2e";
    default-server "irc.test";
    services-server "services.test";
    help-channel "#help";
    modes-on-connect "+ixw";
    anti-spam-quit-message-time 10s;

    // U5 default-rejects plaintext server-to-server links. We accept
    // them here because the Anope link is fully internal to the
    // docker network — never traverses anything external. Anope
    // images don't ship with link certs either, and the alternative
    // (generating + mounting a CA chain) is heavier than the test
    // requires.
    plaintext-policy {
        server allow;
    };

    // The e2e suite reconnects many times per second across tests;
    // U5's default throttle (3 reconnects / 60s per IP) closes those
    // with "Throttled: Reconnecting too fast". Relaxed below because
    // the IRCd is firewalled inside the docker network. U5 syntax
    // replaces the old U3.2 `throttle` block with
    // `set::anti-flood::connect-flood <connections>:<period>`.
    anti-flood {
        connect-flood 100:1;
    };

    // Cloak keys: three strings, 5-100 chars each on U5, REQUIRED
    // mix of a-zA-Z0-9 (Unreal rejects all-lowercase or all-digit
    // patterns at startup). These are throwaway literals for the
    // test container only.
    cloak-keys {
        "a2JO6fh3Q6w4oN3s7";
        "Bp9wKzL1mV5xQ7tH2";
        "Cr4yMnP6sT8vU2xY1";
    };
};
