/*
 * Minimal Anope 2.0 services config for e2e tests. Links to the
 * UnrealIRCd container defined alongside in infra/anope/unrealircd.conf.
 *
 * Verified against anope/anope:2.0 (anope/docker on GitHub).
 *
 * Run via: `docker compose --profile e2e-anope up -d`
 */

// Where to link. `unrealircd` is the docker-compose service name and
// resolves on the boson-network docker bridge. Port 6900 is Unreal's
// serversonly listener.
uplink {
    host = "unrealircd"
    port = 6900
    password = "linkpass"
    ipv6 = no
    ssl = no
}

serverinfo {
    name = "services.test"
    description = "boson e2e services"
    pid = "services.pid"
    motd = "services.motd"
}

// Protocol module. Anope 2.0 has separate modules per Unreal major
// version; `unreal4` covers U4/U5/U6 (despite the name). The bare
// `unreal` module targets U3.2 which is rejected by modern Unreal on
// link.
module {
    name = "unreal4"
}

networkinfo {
    networkname = "boson-e2e"
    nicklen = 31
    userlen = 10
    hostlen = 64
    chanlen = 32
}

options {
    user = "Services"
    seed = 1234567
    readtimeout = 5s
    warningtimeout = 4h

    // Critical for e2e: stop services from sending mail. We disable
    // email-confirmation entirely in nickserv.conf (registration =
    // "none"), but turning off the mailer at this level too means no
    // SMTP attempts will ever be made even if a default config
    // accidentally re-enables it.
    usemail = no
}

include { type = "file"; name = "modules.conf"; }
include { type = "file"; name = "chanserv.conf"; }
include { type = "file"; name = "nickserv.conf"; }

// Empty MOTD file lives next to this one (services.motd).
