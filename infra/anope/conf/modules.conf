/*
 * Module list for e2e tests. Pulls in the database backend +
 * encryption modules Anope needs to operate, plus the OperServ /
 * MemoServ stubs the IRCd protocol module expects to find on link.
 */

// SQLite DB backend — keeps state in a single file in /anope/data.
// Default location is fine for ephemeral test containers.
module {
    name = "db_flatfile"
    database = "anope.db"
    keepbackups = 0
}

// Password hashing. "encryption_sha256" is the modern default;
// "enc_none" is plaintext (test only). We use sha256 to match what a
// real production Anope would use.
module {
    name = "enc_sha256"
}
module {
    name = "enc_none"
}

// OperServ — required by the protocol module on link. We also enable the
// OPER command so Boson's owner-only Operators tab can manage the services
// operator list at runtime (OperServ OPER ADD/DEL/LIST <account> <type>).
// An account added here is auto-recognised as a services operator when it
// identifies, which is what lets a Boson member oper with no password.
module {
    name = "operserv"
    client = "OperServ"
}
service {
    nick = "OperServ"
    user = "OperServ"
    host = "services.test"
    gecos = "Operator Service"
    modes = "+ioS"
}
command { service = "OperServ"; name = "HELP"; command = "generic/help"; }

// os_oper provides `operserv/oper` (OPER ADD/DEL/LIST). The opertype that
// grants this command + the bootstrap oper account live in services.conf.
module { name = "os_oper" }
command { service = "OperServ"; name = "OPER"; command = "operserv/oper"; permission = "operserv/oper"; }

// MemoServ — same rationale.
module {
    name = "memoserv"
    client = "MemoServ"
}
service {
    nick = "MemoServ"
    user = "MemoServ"
    host = "services.test"
    gecos = "Memo Service"
    modes = "+ioS"
}
command { service = "MemoServ"; name = "HELP"; command = "generic/help"; }
