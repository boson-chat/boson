/*
 * NickServ config for e2e tests. The critical bit is
 * `registration = "none"` which makes `REGISTER <pw> <email>` succeed
 * immediately — no email confirmation. This matches what
 * irc.boson.chat would do if email confirm were disabled, and gives
 * the e2e tests a deterministic flow without an SMTP dependency.
 *
 * Reference: https://wiki.anope.org/index.php/2.0/Modules/nickserv/ns_register
 *
 * For an e2e variant that DOES exercise the confirm flow, swap to
 * `registration = "mail"` and add an SMTP-capture sidecar — out of
 * scope for now.
 */

service {
    nick = "NickServ"
    user = "NickServ"
    host = "services.test"
    gecos = "Nickname Registration Service"
    modes = "+ioS"
}

module {
    name = "nickserv"
    client = "NickServ"
    forceemail = no
    defaults = ""
    minpasslen = 5
    maxpasslen = 32
    nonicknameownership = no
}

command { service = "NickServ"; name = "HELP"; command = "generic/help"; }

module { name = "ns_access" }
command { service = "NickServ"; name = "ACCESS"; command = "nickserv/access"; }

module { name = "ns_alist" }
command { service = "NickServ"; name = "ALIST"; command = "nickserv/alist"; }

module { name = "ns_drop" }
command { service = "NickServ"; name = "DROP"; command = "nickserv/drop"; }

module { name = "ns_group" }
command { service = "NickServ"; name = "GROUP"; command = "nickserv/group"; }
command { service = "NickServ"; name = "GLIST"; command = "nickserv/list"; }
command { service = "NickServ"; name = "UNGROUP"; command = "nickserv/ungroup"; }

module { name = "ns_identify" }
command { service = "NickServ"; name = "IDENTIFY"; command = "nickserv/identify"; }
command { service = "NickServ"; name = "ID"; command = "nickserv/identify"; hide = yes; }

module { name = "ns_info" }
command { service = "NickServ"; name = "INFO"; command = "nickserv/info"; }

module { name = "ns_logout" }
command { service = "NickServ"; name = "LOGOUT"; command = "nickserv/logout"; }

// `registration = "mail"` makes Anope email a passcode to the
// address provided at REGISTER time and require a follow-up
// `/msg NickServ CONFIRM <code>` before the account is usable.
// The outbound mail goes through services.conf's sendmailpath
// (our sendmail-shim → mailpit). Set `registration = "none"` to
// restore the no-confirm flow the existing e2e tests assume.
module {
    name = "ns_register"
    registration = "mail"
    passlen = 32
    forceemail = yes
    preregexpire = 1d
}
command { service = "NickServ"; name = "CONFIRM"; command = "nickserv/confirm"; }
command { service = "NickServ"; name = "REGISTER"; command = "nickserv/register"; }
command { service = "NickServ"; name = "RESEND"; command = "nickserv/resend"; }

module { name = "ns_set" }
command { service = "NickServ"; name = "SET"; command = "nickserv/set"; }
command { service = "NickServ"; name = "SET PASSWORD"; command = "nickserv/set/password"; }
command { service = "NickServ"; name = "SET EMAIL"; command = "nickserv/set/email"; }
