/*
 * Stub ChanServ config — required because services.conf includes
 * chanserv.conf. The e2e suite doesn't exercise channel
 * registration today, so just enough to keep Anope happy on boot.
 */

service {
    nick = "ChanServ"
    user = "ChanServ"
    host = "services.test"
    gecos = "Channel Registration Service"
    modes = "+ioS"
}

module {
    name = "chanserv"
    client = "ChanServ"
    defaults = "keeptopic peace secure securefounder signkick"
    maxregistered = 20
    expire = 30d
}

command { service = "ChanServ"; name = "HELP"; command = "generic/help"; }
