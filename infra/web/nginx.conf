# The Boson web client (infra/web/Dockerfile). TLS is Traefik's.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip_static on;

    # The app's only scripts are its own files ('wasm-unsafe-eval' for the
    # engine). It connects to whichever IRC networks' services the user
    # adds (auth, files, voice over WebTransport), hence https:/wss: in
    # connect-src. frame-src 'self': the YouTube wrapper page (below).
    # Kept in step with tests/e2e-app/web-server.ts.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https: blob:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Hashed build output: cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /boson-config.js {
        alias /tmp/boson-config.js;
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The YouTube wrapper (public/youtube-embed.html): the app frames it, and
    # it frames YouTube's player and passes on its errors. Its own CSP
    # (the page's meta CSP, plus who may frame it: only the app), and a
    # referrer for YouTube, which refuses to play without one.
    location = /youtube-embed.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /sso/callback {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files /sso-callback.html =404;
    }

    # The app for any other path (/, /join?…).
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
        try_files $uri /index.html;
    }
}
