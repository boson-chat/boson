# Copy of infra/ergo/ircd.yaml for the opt-in ChanServ e2e suite (no email
# verification, so REGISTER is instant). Minimal ergo IRCd config for local E2E tests — plain TCP on 6667, no TLS,
# anonymous connections allowed, channels auto-created. NOT for production.
network:
  name: BosonTest

server:
  name: ergo.test
  listeners:
    ":6667":
      tls:
        cert: ""
        key: ""
      proxy: false

  max-sendq: 96k

  ip-cloaking:
    enabled: false

accounts:
  registration:
    enabled: true
    allow-before-connect: true
    bcrypt-cost: 4
    verify-timeout: "32h"
    # Ergo's modern schema: a single `email-verification` block
    # under `registration` toggles the mailto callback. (The old
    # `enabled-callbacks: [mailto]` + `callbacks.mailto.*` API
    # was removed — leaving those keys here silently leaves
    # email verification OFF, which is what bit us.)
    #
    # `mta.server: mailpit` reroutes outbound SMTP to the
    # mailpit container so the backend POP3 worker can pull
    # the confirmation code for the "Claim this nick" flow.
    # Switch `enabled: false` to restore the no-confirm flow
    # the existing e2e tests assume (their reply assertions
    # will fail with verification on).
    email-verification:
      enabled: false
  authentication-enabled: true
  require-sasl:
    enabled: false
  multiclient:
    enabled: true
    allowed-by-default: true
  nick-reservation:
    enabled: false
  default-user-modes: ""
  login-throttling:
    enabled: false

channels:
  default-modes: ""
  registration:
    enabled: true
  list-delay: 0s

opers: {}

limits:
  nicklen: 32
  identlen: 20
  channellen: 64
  awaylen: 390
  kicklen: 390
  topiclen: 390
  monitor-entries: 100
  whowas-entries: 100
  chan-list-modes: 60
  registration-messages: 1024
  multiline:
    max-bytes: 4096
    max-lines: 100

fakelag:
  enabled: false
  window: 1s
  burst-limit: 5
  messages-per-window: 2
  cooldown: 2s

history:
  enabled: false
  channel-length: 0
  client-length: 0
  autoresize-window: 0s
  autoreplay-on-join: 0
  chathistory-maxmessages: 0
  znc-maxmessages: 0

logging:
  - method: stderr
    level: debug
    type: "*"

datastore:
  path: /ircd/ircd.db
