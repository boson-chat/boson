# Minimal InspIRCd 3 config for e2e tests. Plaintext-only, ephemeral.
# Pairs with infra/atheme/atheme.conf via the shared linkpass below.
# Pinned to v3 (not v4) because the Atheme 7.2.12 image's
# protocol/inspircd module speaks the v3 wire protocol — InspIRCd 4
# removed v2/v3 compat layers and rejects the CAPAB START exchange.
# See https://github.com/atheme/atheme/issues/904.
#
# Run via: `docker compose --profile e2e-atheme up -d`
# Host ports: 6669 (client). 7000 stays inside the docker network.
#
# References:
#   https://docs.inspircd.org/3/configuration/
#   https://docs.inspircd.org/3/modules/spanningtree/
#   https://atheme.dev/docs/config/uplink/

<server name="irc.test"
        description="boson e2e ircd"
        network="boson-e2e"
        id="00A">

<admin name="boson-e2e" nick="admin" email="noreply@test.invalid">

# Client port (mapped to host 6669 via docker-compose).
<bind address="" port="6667" type="clients">

# Services link port. Plaintext, internal to the docker network.
<bind address="" port="7000" type="servers">

# Generous reconnect quota — the e2e suite churns many short
# sessions in a row and InspIRCd's defaults are conservative.
<connect allow="*"
         recvq="65536"
         softsendq="8192"
         hardsendq="131072"
         pingfreq="120"
         timeout="10"
         localmax="100"
         globalmax="100"
         maxchans="20">

# Atheme services link. `sendpass` and `recvpass` must match the
# `send_password` / `receive_password` in atheme.conf:uplink.
<link name="services.test"
      ipaddr="*"
      port="7000"
      allowmask="*"
      sendpass="linkpass"
      recvpass="linkpass">

# Mark services.test as a U-line so Atheme can override modes
# and act as a privileged service.
<uline server="services.test">

<options prefixquit="Quit: " suffixquit="">

<files motd="">

# Modules. spanningtree enables the services-link. services_account
# is required by Atheme: it provides the account-name binding
# (R: bursts) Atheme uses to track which client is identified to
# which NickServ account.
#
# The remaining modules cover modes Atheme tries to set during
# burst — without them, Atheme aborts with "Protocol violation:
# Unrecognised mode" (e.g. 'd' = m_deaf, 'B' = m_botmode). svshold
# is what NickServ uses to enforce ownership on nick takeovers;
# noisy warning without it.
<module name="spanningtree">
<module name="services_account">
<module name="deaf">
<module name="botmode">
<module name="hidechans">
<module name="svshold">
<module name="callerid">

# Permissive class so the link block's password check is the only
# gate. The bare default-class config triggers connect throttles
# that fight the e2e suite's repeated reconnects.
<class name="Shutdown"
       commands="DIE RESTART REHASH LOADMODULE UNLOADMODULE RELOADMODULE">

<type name="NetAdmin"
      classes="Shutdown"
      modes="o">
