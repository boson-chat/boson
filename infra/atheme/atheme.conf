/*
 * Minimal Atheme 7.2.12 services config for e2e tests. Links to the
 * InspIRCd 3.18 container alongside via the shared linkpass below.
 *
 * Verified against ovdnet/atheme:latest (= atheme-services 7.2.12).
 * The crucial bit is `serverinfo::auth = none;` which disables
 * email confirmation on REGISTER — no SMTP dependency.
 *
 * Run via: `docker compose --profile e2e-atheme up -d`
 *
 * References:
 *   https://atheme.dev/docs/config/serverinfo/
 *   https://atheme.dev/docs/config/uplink/
 *   https://github.com/atheme/atheme/blob/v7.2.12/dist/atheme.conf.example
 */

/* ---- Backends + crypto -------------------------------------------- */

loadmodule "/atheme/modules/backend/opensex";
loadmodule "/atheme/modules/crypto/pbkdf2v2";

/* ---- Protocol module --------------------------------------------- */

/* Atheme 7.2.x's `protocol/inspircd` speaks the InspIRCd 3 protocol.
 * Don't pair this with InspIRCd 4 — the CAPAB START handshake will
 * be rejected (issue atheme/atheme#904, fixed in atheme master). */
loadmodule "/atheme/modules/protocol/inspircd";

/* ---- NickServ ---------------------------------------------------- */

loadmodule "/atheme/modules/nickserv/main";
loadmodule "/atheme/modules/nickserv/register";
loadmodule "/atheme/modules/nickserv/verify";
loadmodule "/atheme/modules/nickserv/identify";
loadmodule "/atheme/modules/nickserv/logout";
loadmodule "/atheme/modules/nickserv/drop";
loadmodule "/atheme/modules/nickserv/info";
loadmodule "/atheme/modules/nickserv/ghost";
loadmodule "/atheme/modules/nickserv/group";
loadmodule "/atheme/modules/nickserv/set_password";
loadmodule "/atheme/modules/nickserv/set_email";

/* ---- ChanServ (kept minimal — channel flows aren't e2e-tested) --- */

loadmodule "/atheme/modules/chanserv/main";
loadmodule "/atheme/modules/chanserv/register";
loadmodule "/atheme/modules/chanserv/flags";

/* ---- OperServ (link sanity) -------------------------------------- */

loadmodule "/atheme/modules/operserv/main";

/* ---- Server info -------------------------------------------------- */

serverinfo {
    /* The ovdnet/atheme image installs modules under /atheme/modules,
     * but the runtime defaults to looking in /atheme/. Override so
     * `loadmodule "/atheme/modules/nickserv/main"` resolves to
     * /atheme/modules/nickserv/main.so. */
    modulepath = "/atheme/modules";

    /* MUST differ from inspircd's <server name=...> — Atheme is a
     * separate pseudo-server linking in. */
    name = "services.test";
    desc = "boson e2e atheme";
    numeric = "00B";
    netname = "boson-e2e";

    /* Suffix appended to a user's host when they identify (the
     * "cloak" Atheme grants). Not exercised in e2e, but the module
     * requires the field. */
    hidehostsuffix = "users.boson-e2e";

    adminname = "boson-e2e";
    adminemail = "noreply@test.invalid";
    registeremail = "noreply@test.invalid";

    /*
     * auth = none disables email confirmation on REGISTER. With
     * `auth = email` Atheme would expect VERIFY <code> as a second
     * step, which needs an SMTP sink we don't have in the test
     * stack. With `auth = none` the REGISTER reply lands on
     * `\<name\> has now been verified.` directly.
     */
    auth = none;

    /* InspIRCd's default casemapping. */
    casemapping = ascii;
};

/* ---- Uplink ------------------------------------------------------- */

uplink "irc.test" {
    /* `host` is the docker-compose service name; resolves on the
     * boson-network bridge. */
    host = "inspircd";
    port = 7000;
    send_password = "linkpass";
    receive_password = "linkpass";
};

/* ---- General behavior -------------------------------------------- */

general {
    silent = no;
    verbose_wallops = no;
    join_chans = yes;
    leave_chans = yes;
    enable_fantasy = no;
};

/* ---- Service nicks ----------------------------------------------- */

nickserv {
    nick = "NickServ";
    user = "NickServ";
    host = "services.test";
    real = "Nickname Services";
};

chanserv {
    nick = "ChanServ";
    user = "ChanServ";
    host = "services.test";
    real = "Channel Services";
};

operserv {
    nick = "OperServ";
    user = "OperServ";
    host = "services.test";
    real = "Operator Services";
};
