# Isolated infra for the real-app (Wails) e2e suite (client/tests/e2e-app/).
#
#   node client/scripts/e2e-stack.mjs up
#   node client/scripts/e2e-stack.mjs down
#
# (or `make test-e2e-app-up` / `make test-e2e-app-down`). The guest-only
# specs need just ergo + ZNC; account-mode specs also need Postgres, the
# catch-all Mailpit, MinIO, the boson auth service (+ its Postgres and the
# users' Mailpit) and the boson backend (github.com/boson-chat/backend), run
# from its image ($BACKEND_IMAGE, default below) after a one-shot
# `migrate up`.
#
# Deliberately a separate compose PROJECT (`name: boson-e2e`) with its own
# network, no named volumes and non-default host ports, so it can run next to
# the dev stack (boson-ergo-1 on :6667, boson-postgres-1 on :5432, …) without
# touching it. Every service keeps its state in tmpfs: every
# `up --force-recreate` is fresh.
#
#   ergo      127.0.0.1:16667  IRC (plain)
#   znc       127.0.0.1:16501  bouncer, users tester1..tester8 (pw `pw`)
#   backend   127.0.0.1:13000  boson backend API (github.com/boson-chat/backend)
#             127.0.0.1:13001  its internal listener (token e2e-internal-token)
#   postgres  127.0.0.1:16432  backend DB (boson/boson/boson)
#   mailpit   127.0.0.1:11025  SMTP  ← ergo's NickServ mailto callback
#             127.0.0.1:11110  POP3  → backend nick-claim worker (e2e/e2e)
#             127.0.0.1:18025  HTTP API / UI
#   mailpit-archive  127.0.0.1:18026  HTTP API: a copy of every catch-all mail
#   minio     127.0.0.1:19000  S3 API (minioadmin/minioadmin, bucket `boson`)
#             127.0.0.1:19001  console
#   auth      127.0.0.1:18180  boson auth service (github.com/boson-chat/auth)
#   auth-mailpit 127.0.0.1:18325  HTTP API / UI: the users' inboxes
#   auth-postgres 127.0.0.1:16433  the auth service's DB (auth/auth/auth)
#   directory 127.0.0.1:18480  boson network directory (github.com/boson-chat/directory)
#   directory-postgres 127.0.0.1:16434  the directory's DB (directory/directory/directory)
#   auth2     127.0.0.1:18181  a SECOND auth service: a self-hosted network's own
#   auth2-postgres 127.0.0.1:16435  its DB (auth/auth/auth)
#   ergo2     127.0.0.1:16668  that network's IRC (the boson stack's Ergo image:
#                              accounts in auth2, SASL OAUTHBEARER, no guests)
#
# The auth service is a private repo, so its image comes from outside:
# e2e-stack.mjs builds it from a checkout ($AUTH_SRC, default ../auth next
# to this repo) as boson-e2e-auth:local, or uses $AUTH_IMAGE as given (e.g.
# harbor.floret.dev/boson/auth:<version>, after `docker login`).
name: boson-e2e

services:
  ergo:
    image: ghcr.io/ergochat/ergo:v2.19.1
    ports:
      - '127.0.0.1:16667:6667'
    tmpfs:
      - /ircd
    volumes:
      - ./ergo.yaml:/ircd/ircd.yaml:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6667']
      interval: 1s
      timeout: 2s
      retries: 30

  znc:
    image: znc:1.9.1
    ports:
      - '127.0.0.1:16501:6501'
    # The image chowns /znc-data to the znc user at startup, so seed the
    # config from a read-only mount into tmpfs, then hand over to the stock
    # entrypoint (which drops privileges and launches ZNC).
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /znc-data/configs && cp /seed/znc.conf /znc-data/configs/znc.conf && exec /entrypoint.sh
    tmpfs:
      - /znc-data
    volumes:
      - ./znc.conf:/seed/znc.conf:ro
    depends_on:
      ergo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6501']
      interval: 1s
      timeout: 2s
      retries: 30

  # The backend's own database (the auth service has its own, as in
  # production). Migrated by backend-migrate below.
  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:16432:5432'
    environment:
      POSTGRES_USER: boson
      POSTGRES_PASSWORD: boson
      POSTGRES_DB: boson
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boson -d boson']
      interval: 1s
      timeout: 3s
      retries: 60

  # ---- boson backend ---------------------------------------------------------
  # github.com/boson-chat/backend from its released image. Env-only config
  # (the image ships no config file); endpoints match stack.json. Tokens carry
  # the issuer the app signs in with (the host URL); the keys are fetched
  # inside the network. Avatars go to MinIO over the network, their URLs
  # (CDN base) are the host's MinIO port so the app can load them.
  backend-migrate:
    image: ${BACKEND_IMAGE:-harbor.floret.dev/boson/backend:${BACKEND_IMAGE_TAG:-0.57.0}}
    command: ['migrate', 'up']
    environment: &backend-env
      # The web build under e2e (stack.json web.url) calls it cross-origin.
      ALLOWED_ORIGINS: http://127.0.0.1:18800
      ENV: e2e
      PORT: '3000'
      DBHOST: postgres
      DBPORT: '5432'
      DBNAME: boson
      DBUSERNAME: boson
      DBPASSWORD: boson
      DBSSLMODE: disable
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: http://127.0.0.1:18180
      AUTH_AUDIENCE: boson
      # Nick claims are off by default; the e2e stack runs them (inbound =
      # the catch-all Mailpit, via the older PURELYMAIL_* names on purpose:
      # they still work as fallbacks).
      NICK_CLAIM_ENABLED: 'true'
      PURELYMAIL_POP3_HOST: mailpit
      PURELYMAIL_POP3_PORT: '1110'
      PURELYMAIL_POP3_USER: e2e
      PURELYMAIL_POP3_PASSWORD: e2e
      PURELYMAIL_POP3_TLS: 'false'
      NICK_CLAIM_EMAIL_DOMAIN: boson.chat
      NICK_CLAIM_RATE_LIMIT_PER_HOUR: '1000'
      INTERNAL_ADDR: ':3001'
      INTERNAL_TOKEN: e2e-internal-token
      CLOUDFLARE_R2_ACCESS_KEY: minioadmin
      CLOUDFLARE_R2_SECRET_KEY: minioadmin
      CLOUDFLARE_R2_ENDPOINT: http://minio:9000
      CLOUDFLARE_R2_BUCKET: boson
      CLOUDFLARE_CDN_BASE_URL: http://127.0.0.1:19000/boson
      # Link previews (/v1/unfurl) for the web build. The test pages live on
      # the host: chat-embeds' site under unfurl.e2e.test (its own port), and
      # Spotify's embed pages on the e2e web server (stack.json web.port).
      # Only these names skip the SSRF guard (not in production).
      UNFURL_TEST_HOST_MAP: unfurl.e2e.test=host.docker.internal,open.spotify.com=host.docker.internal:18800
      # Every test shares one address.
      UNFURL_RATE_PER_IP: '0'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:-harbor.floret.dev/boson/backend:${BACKEND_IMAGE_TAG:-0.57.0}}
    command: ['serve']
    ports:
      - '127.0.0.1:13000:3000'
      - '127.0.0.1:13001:3001'
    environment: *backend-env
    # The host's test servers (UNFURL_TEST_HOST_MAP).
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_started
      auth:
        condition: service_started

  # The boson.chat catch-all mailbox (PurelyMail in production): ergo's
  # NickServ verification mails land here and the backend's nick-claim POP3
  # worker drains it. That worker DELEs every message it can't route, so the
  # users' own inbox (the auth service's mail) is a different Mailpit —
  # auth-mailpit below (127.0.0.1:18325).
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:11110:1110'
      - '127.0.0.1:18025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_POP3_AUTH: 'e2e:e2e'
      # Copy every message to mailpit-archive (below) as it arrives.
      MP_SMTP_RELAY_HOST: mailpit-archive
      MP_SMTP_RELAY_PORT: '1025'
      MP_SMTP_RELAY_ALL: 'true'
    depends_on:
      mailpit-archive:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 1s
      timeout: 3s
      retries: 30

  # What the tests read NickServ codes from. The catch-all above is the
  # worker's inbox, and the worker DELEs anything it can't route within ~5s
  # (every guest REGISTER) — reading it raced the drain. Nothing consumes
  # this copy, so a code is there for as long as a test needs it.
  mailpit-archive:
    image: axllent/mailpit:v1.31.3
    ports:
      - '127.0.0.1:18026:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 1s
      timeout: 3s
      retries: 30

  # S3 stand-in for Cloudflare R2 (avatars), as in the
  # dev stack's `minio` service. Chainguard builds (MinIO no longer
  # publishes images to Docker Hub / quay.io).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:19000:9000'
      - '127.0.0.1:19001:9001'
    tmpfs:
      - /data

  # One-shot: create the `boson` bucket and make it anonymously readable so
  # avatar URLs load straight into the app. Chainguard's minio-client image
  # has no shell, so its `mc` is copied onto wolfi-base.
  minio-setup:
    build:
      dockerfile_inline: |
        FROM cgr.dev/chainguard/minio-client:latest AS mc
        FROM cgr.dev/chainguard/wolfi-base:latest
        COPY --from=mc /usr/bin/mc /usr/bin/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/boson;
      mc anonymous set download local/boson;
      echo 'minio bucket ready';
      "

  # ---- boson auth service ----------------------------------------------------
  # Accounts, sign-in, tokens. Its verification / reset links point at its
  # own built-in pages (APP_URL = PUBLIC_URL). The encryption key below is a
  # throwaway for this tmpfs-only stack; never reuse it.
  auth-postgres:
    image: postgres:18-alpine
    ports:
      - '127.0.0.1:16433:5432'
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d auth']
      interval: 1s
      timeout: 3s
      retries: 60

  auth-mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '127.0.0.1:18325:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 1s
      timeout: 3s
      retries: 30

  auth:
    image: ${AUTH_IMAGE:-boson-e2e-auth:local}
    pull_policy: never
    ports:
      - '127.0.0.1:18180:8080'
    environment:
      ENV: development
      PUBLIC_URL: http://127.0.0.1:18180
      # The web build under e2e (stack.json web.url) calls it cross-origin.
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:18180,http://127.0.0.1:18800
      SSO_RETURN_TO_ALLOWED: http://127.0.0.1:*,http://[::1]:*,boson://,http://127.0.0.1:18800/sso/callback
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgres://auth:auth@auth-postgres:5432/auth?sslmode=disable
      AUTH_KEY_ENCRYPTION_KEY: ZTJlLW9ubHkta2V5LWZvci10aGUtdG1wZnMtc3RhY2s=
      REGISTRATION: open
      REQUIRE_EMAIL_VERIFICATION: 'true'
      SMTP_HOST: auth-mailpit
      SMTP_PORT: '1025'
      SMTP_TLS: none
      SMTP_FROM: Boson <no-reply@boson.test>
      # Parallel workers sign up / in a lot from one IP.
      RATE_LIMIT_IP_BURST: '1000'
      RATE_LIMIT_IP_PER_MINUTE: '1000'
      RATE_LIMIT_ACCOUNT_BURST: '100'
      RATE_LIMIT_ACCOUNT_PER_MINUTE: '100'
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-mailpit:
        condition: service_healthy

  # ---- boson network directory ------------------------------------------------
  # github.com/boson-chat/directory, the service directory.boson.chat runs:
  # the app browses and hosts listings through its /v1 API. Fake DNS (every
  # verify succeeds, so listings need no TXT record), no background verify /
  # health workers (the tests set those columns themselves), no peers, and
  # write limits high enough for parallel workers.
  directory-postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:16434:5432'
    environment:
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
      POSTGRES_DB: directory
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U directory -d directory']
      interval: 1s
      timeout: 3s
      retries: 60

  directory:
    image: ${DIRECTORY_IMAGE:-harbor.floret.dev/boson/directory:1.3.0}
    ports:
      - '127.0.0.1:18480:8080'
    environment:
      ENV: development
      DIRECTORY_PUBLIC_URL: http://127.0.0.1:18480
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:18800
      DATABASE_URL: postgres://directory:directory@directory-postgres:5432/directory?sslmode=disable
      # Tokens carry the issuer the app signs in with (the host URL); the keys
      # are fetched inside the network.
      AUTH_ISSUER: http://127.0.0.1:18180
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_AUDIENCE: boson
      DIRECTORY_NAME: boson e2e directory
      DNS_VERIFIER: fake
      VERIFY_WORKER_ENABLED: 'false'
      HEALTH_WORKER_ENABLED: 'false'
      DIRECTORY_INCLUDE_MAIN: 'false'
      RATE_LIMIT_WRITES_PER_MINUTE: '100000'
      RATE_LIMIT_WRITE_BURST: '100000'
    tmpfs:
      - /media:mode=1777
    depends_on:
      directory-postgres:
        condition: service_healthy
      auth:
        condition: service_started

  # ---- a self-hosted network (network-signin.spec.ts) --------------------------
  # Its own auth service (same image as `auth`, separate database and issuer)
  # and its own Ergo, as a network running the boson stack would have. The app
  # finds it through BOSON_NETWORK_JSON (the spec's boson.json for `localhost`).
  # Mail goes to the users' Mailpit; sign-ups need no verification here.
  auth2-postgres:
    image: postgres:18-alpine
    ports:
      - '127.0.0.1:16435:5432'
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d auth']
      interval: 1s
      timeout: 3s
      retries: 60

  auth2:
    image: ${AUTH_IMAGE:-boson-e2e-auth:local}
    pull_policy: never
    ports:
      - '127.0.0.1:18181:8080'
    environment:
      ENV: development
      PUBLIC_URL: http://127.0.0.1:18181
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:18181,http://127.0.0.1:18800
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgres://auth:auth@auth2-postgres:5432/auth?sslmode=disable
      AUTH_KEY_ENCRYPTION_KEY: ZTJlLXNlbGZob3N0LW5ldHdvcmsta2V5LXRtcGZzISE=
      REGISTRATION: open
      REQUIRE_EMAIL_VERIFICATION: 'false'
      SITE_NAME: Selfhost
      SMTP_HOST: auth-mailpit
      SMTP_PORT: '1025'
      SMTP_TLS: none
      SMTP_FROM: Selfhost <no-reply@selfhost.test>
      RATE_LIMIT_IP_BURST: '1000'
      RATE_LIMIT_IP_PER_MINUTE: '1000'
      RATE_LIMIT_ACCOUNT_BURST: '100'
      RATE_LIMIT_ACCOUNT_PER_MINUTE: '100'
    depends_on:
      auth2-postgres:
        condition: service_healthy

  ergo2:
    image: ${STACK_ERGO_IMAGE:-harbor.floret.dev/boson/stack-ergo:2.19.1}
    entrypoint: ['/ircd-bin/ergo']
    command: ['run', '--conf', '/etc/ergo2/ircd.yaml']
    ports:
      - '127.0.0.1:16668:6667'
    environment:
      # boson-ergo auth-script: verify OAUTHBEARER tokens against auth2.
      AUTH_JWKS_URL: http://auth2:8080/.well-known/jwks.json
      AUTH_ISSUER: http://127.0.0.1:18181
      IRC_ROLES: 'false'
    tmpfs:
      - /ircd:mode=1777
    volumes:
      - ./ergo2.yaml:/etc/ergo2/ircd.yaml:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6667']
      interval: 1s
      timeout: 2s
      retries: 30


  # ---- voice + video (the web build's calls: web-calls.spec.ts) --------------
  # quicvoiced and quicvideod with their self-signed dev certificates (no
  # TLS_CERT_FILE): browsers reach them over WebTransport by the
  # certificate's hash (/v1/info dev_cert_hash). Voice tokens come from the
  # e2e auth service (aud quicvoice); video tickets from quicvoiced.
  quicvoiced:
    image: ${QUICVOICE_IMAGE:-harbor.floret.dev/boson/quicvoice:1.15.0}
    ports:
      - '127.0.0.1:17700:7700/udp'
      - '127.0.0.1:18890:8090'
    environment:
      ENV: development
      QUIC_ADDR: ':7700'
      HTTP_ADDR: ':8080'
      PUBLIC_HTTP_ADDR: ':8090'
      DEV_HOSTNAME: 127.0.0.1
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: http://127.0.0.1:18180
      AUTH_AUDIENCE: quicvoice
      VOICE_ROOMS: general:General,lounge:Lounge
      VOICE_ROOMS_STRICT: 'true'
      WEBTRANSPORT_ORIGINS: http://127.0.0.1:18800
      VIDEO_QUIC_URL: quic://127.0.0.1:17710
      VIDEO_WEBTRANSPORT_URL: https://127.0.0.1:17710/wt
      VIDEO_TICKET_KEY_FILE: /data/video-ticket.key
      VIDEO_CONTROL_URL: http://quicvideod:8091
      VIDEO_CONTROL_TOKEN: e2e-video-control
    tmpfs:
      - /data:mode=1777
    depends_on:
      auth:
        condition: service_started

  quicvideod:
    image: ${QUICVIDEO_IMAGE:-harbor.floret.dev/boson/quicvideo:1.14.0}
    ports:
      - '127.0.0.1:17710:7710/udp'
      - '127.0.0.1:18891:8090'
    environment:
      ENV: development
      QUIC_ADDR: ':7710'
      HTTP_ADDR: ':8080'
      PUBLIC_HTTP_ADDR: ':8090'
      CONTROL_HTTP_ADDR: ':8091'
      CONTROL_TOKEN: e2e-video-control
      VOICE_SYNC: 'true'
      DEV_HOSTNAME: 127.0.0.1
      AUTH_JWKS_URL: http://quicvoiced:8090/.well-known/video-jwks.json
      AUTH_ISSUER: voice
      AUTH_AUDIENCE: quicvideo
      WEBTRANSPORT_ORIGINS: http://127.0.0.1:18800
