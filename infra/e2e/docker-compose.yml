# Isolated infra for the real-app (Wails) e2e suite (client/tests/e2e-app/).
#
#   node client/scripts/e2e-stack.mjs up     # this file + backend
#   node client/scripts/e2e-stack.mjs down
#
# (or `make test-e2e-app-up` / `make test-e2e-app-down`). The guest-only
# specs need just ergo + ZNC; account-mode specs also need Postgres, the
# catch-all Mailpit, MinIO, the boson auth service (+ its Postgres and the
# users' Mailpit) and the Go backend, which e2e-stack.mjs runs on the host.
#
# Deliberately a separate compose PROJECT (`name: boson-e2e`) with its own
# network, no named volumes and non-default host ports, so it can run next to
# the dev stack (boson-ergo-1 on :6667, boson-postgres-1 on :5432, …) without
# touching it. Every service keeps its state in tmpfs: every
# `up --force-recreate` is fresh.
#
#   ergo      127.0.0.1:16667  IRC (plain)
#   znc       127.0.0.1:16501  bouncer, users tester1..tester8 (pw `pw`)
#   postgres  127.0.0.1:16432  backend DB (boson/boson/boson)
#   mailpit   127.0.0.1:11025  SMTP  ← ergo's NickServ mailto callback
#             127.0.0.1:11110  POP3  → backend nick-claim worker (e2e/e2e)
#             127.0.0.1:18025  HTTP API / UI
#   mailpit-archive  127.0.0.1:18026  HTTP API: a copy of every catch-all mail
#   minio     127.0.0.1:19000  S3 API (minioadmin/minioadmin, bucket `boson`)
#             127.0.0.1:19001  console
#   auth      127.0.0.1:18180  boson auth service (github.com/boson-chat/auth)
#   auth-mailpit 127.0.0.1:18325  HTTP API / UI: the users' inboxes
#   auth-postgres 127.0.0.1:16433  the auth service's DB (auth/auth/auth)
#
# The auth service is a private repo, so its image comes from outside:
# e2e-stack.mjs builds it from a checkout ($AUTH_SRC, default ../auth next
# to this repo) as boson-e2e-auth:local, or uses $AUTH_IMAGE as given (e.g.
# harbor.floret.dev/boson/auth:<version>, after `docker login`).
name: boson-e2e

services:
  ergo:
    image: ghcr.io/ergochat/ergo:v2.19.1
    ports:
      - '127.0.0.1:16667:6667'
    tmpfs:
      - /ircd
    volumes:
      - ./ergo.yaml:/ircd/ircd.yaml:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6667']
      interval: 1s
      timeout: 2s
      retries: 30

  znc:
    image: znc:1.9.1
    ports:
      - '127.0.0.1:16501:6501'
    # The image chowns /znc-data to the znc user at startup, so seed the
    # config from a read-only mount into tmpfs, then hand over to the stock
    # entrypoint (which drops privileges and launches ZNC).
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /znc-data/configs && cp /seed/znc.conf /znc-data/configs/znc.conf && exec /entrypoint.sh
    tmpfs:
      - /znc-data
    volumes:
      - ./znc.conf:/seed/znc.conf:ro
    depends_on:
      ergo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6501']
      interval: 1s
      timeout: 2s
      retries: 30

  # The backend's own database (the auth service has its own, as in
  # production). Migrated by e2e-stack.mjs (`server migrate up`).
  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:16432:5432'
    environment:
      POSTGRES_USER: boson
      POSTGRES_PASSWORD: boson
      POSTGRES_DB: boson
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boson -d boson']
      interval: 1s
      timeout: 3s
      retries: 60

  # The boson.chat catch-all mailbox (PurelyMail in production): ergo's
  # NickServ verification mails land here and the backend's nick-claim POP3
  # worker drains it. That worker DELEs every message it can't route, so the
  # users' own inbox (the auth service's mail) is a different Mailpit —
  # auth-mailpit below (127.0.0.1:18325).
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:11110:1110'
      - '127.0.0.1:18025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_POP3_AUTH: 'e2e:e2e'
      # Copy every message to mailpit-archive (below) as it arrives.
      MP_SMTP_RELAY_HOST: mailpit-archive
      MP_SMTP_RELAY_PORT: '1025'
      MP_SMTP_RELAY_ALL: 'true'
    depends_on:
      mailpit-archive:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 1s
      timeout: 3s
      retries: 30

  # What the tests read NickServ codes from. The catch-all above is the
  # worker's inbox, and the worker DELEs anything it can't route within ~5s
  # (every guest REGISTER) — reading it raced the drain. Nothing consumes
  # this copy, so a code is there for as long as a test needs it.
  mailpit-archive:
    image: axllent/mailpit:v1.31.3
    ports:
      - '127.0.0.1:18026:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 1s
      timeout: 3s
      retries: 30

  # S3 stand-in for Cloudflare R2 (avatars, server icons/banners), as in the
  # dev stack's `minio` service. Chainguard builds (MinIO no longer
  # publishes images to Docker Hub / quay.io).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:19000:9000'
      - '127.0.0.1:19001:9001'
    tmpfs:
      - /data

  # One-shot: create the `boson` bucket and make it anonymously readable so
  # avatar URLs load straight into the app. Chainguard's minio-client image
  # has no shell, so its `mc` is copied onto wolfi-base.
  minio-setup:
    build:
      dockerfile_inline: |
        FROM cgr.dev/chainguard/minio-client:latest AS mc
        FROM cgr.dev/chainguard/wolfi-base:latest
        COPY --from=mc /usr/bin/mc /usr/bin/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/boson;
      mc anonymous set download local/boson;
      echo 'minio bucket ready';
      "

  # ---- boson auth service ----------------------------------------------------
  # Accounts, sign-in, tokens. Its verification / reset links point at its
  # own built-in pages (APP_URL = PUBLIC_URL). The encryption key below is a
  # throwaway for this tmpfs-only stack; never reuse it.
  auth-postgres:
    image: postgres:18-alpine
    ports:
      - '127.0.0.1:16433:5432'
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d auth']
      interval: 1s
      timeout: 3s
      retries: 60

  auth-mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '127.0.0.1:18325:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 1s
      timeout: 3s
      retries: 30

  auth:
    image: ${AUTH_IMAGE:-boson-e2e-auth:local}
    pull_policy: never
    ports:
      - '127.0.0.1:18180:8080'
    environment:
      ENV: development
      PUBLIC_URL: http://127.0.0.1:18180
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgres://auth:auth@auth-postgres:5432/auth?sslmode=disable
      AUTH_KEY_ENCRYPTION_KEY: ZTJlLW9ubHkta2V5LWZvci10aGUtdG1wZnMtc3RhY2s=
      REGISTRATION: open
      REQUIRE_EMAIL_VERIFICATION: 'true'
      SMTP_HOST: auth-mailpit
      SMTP_PORT: '1025'
      SMTP_TLS: none
      SMTP_FROM: Boson <no-reply@boson.test>
      # Parallel workers sign up / in a lot from one IP.
      RATE_LIMIT_IP_BURST: '1000'
      RATE_LIMIT_IP_PER_MINUTE: '1000'
      RATE_LIMIT_ACCOUNT_BURST: '100'
      RATE_LIMIT_ACCOUNT_PER_MINUTE: '100'
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-mailpit:
        condition: service_healthy
