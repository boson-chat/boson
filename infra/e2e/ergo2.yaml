# Ergo for the "self-hosted network" e2e specs (client/tests/e2e-app/
# network-signin.spec.ts): a second boson-style network with its own auth
# service (auth2 in docker-compose.yml). Run from the boson stack's Ergo
# image (patched Ergo + boson-ergo), with the same accounts setup the stack
# uses: accounts live in the network's auth service, SASL OAUTHBEARER takes
# its access tokens (checked by `boson-ergo auth-script` against auth2's
# JWKS), and — unlike the stack's default — no guests: every client must log
# in (accounts.require-sasl), so connecting at all proves the app's
# OAUTHBEARER login.
network:
  name: SelfhostE2E

server:
  name: ergo2.e2e
  listeners:
    ":6667":
      tls:
        cert: ""
        key: ""
      proxy: false
  max-sendq: 96k
  ip-cloaking:
    enabled: false
  ip-limits:
    count: false
    throttle: false
  check-ident: false
  lookup-hostnames: false
  enforce-utf8: true

accounts:
  registration:
    enabled: false
  authentication-enabled: true
  require-sasl:
    enabled: true
  # Webpush needs always-on to be possible; opt-in keeps every other spec's
  # one-connection-per-account behaviour.
  multiclient:
    enabled: true
    allowed-by-default: false
    always-on: opt-in
  nick-reservation:
    enabled: false
  default-user-modes: ""
  login-throttling:
    enabled: false
  auth-script:
    enabled: true
    command: "/usr/local/bin/boson-ergo"
    args: ["auth-script"]
    autocreate: true
    timeout: 9s
    kill-timeout: 1s
    max-concurrency: 16
  oauth2:
    enabled: true
    autocreate: true
    auth-script: true
    # Unused (auth-script validates), but Ergo wants a parseable value.
    introspection-url: "http://auth2:8080/unused"
    introspection-timeout: 10s

channels:
  default-modes: ""
  registration:
    enabled: false
  list-delay: 0s

opers: {}

limits:
  nicklen: 32
  identlen: 20
  channellen: 64
  awaylen: 390
  kicklen: 390
  topiclen: 390
  monitor-entries: 100
  whowas-entries: 100
  chan-list-modes: 60
  registration-messages: 1024
  multiline:
    max-bytes: 4096
    max-lines: 100

fakelag:
  enabled: false

history:
  enabled: false

# draft/webpush, as the boson stack renders it (docs/push.md §1): the app
# sees the cap and VAPID= and registers (push.spec.ts). Ergo can't push to a
# test receiver here (it refuses internal addresses), so the spec checks the
# client's side: the registration it sends and the worker that shows pushes.
webpush:
  enabled: true
  timeout: 3s
  delay: 0s
  subscriber: "https://ergo2.e2e.example/"
  max-subscriptions: 8
  expiration: 30d

logging:
  - method: stderr
    level: info
    type: "* -userinput -useroutput"

datastore:
  path: /ircd/ircd.db
