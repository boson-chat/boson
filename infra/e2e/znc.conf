// ZNC 1.9 config for the real-app e2e suite (client/tests/e2e-app/).
// Copied into a tmpfs /znc-data on every container start (see
// docker-compose.yml), so runtime changes never persist between `up`s.
//
// Users tester1..tester8 (password `pw`), one per concurrently running
// test: fixtures.ts leases them (zncUser fixture) so parallel workers never
// share a bouncer. Clients pick the network with PASS testerN/ergo:pw. Each
// `ergo` network points at the e2e ergo service and starts DISCONNECTED
// (IRCConnectEnabled = false) so the suite can exercise the app's "bouncer
// isn't connected" → auto-connect path.
//
// Generated — keep the user blocks identical (edit one, then regenerate the
// rest with the same text).
Version = 1.9.1

// Reconnect pacing. Defaults are ServerThrottle = 30 (s between attempts to
// the same server) and ConnectDelay = 5; the suite connects / disconnects /
// reconnects within seconds, so keep both minimal.
ServerThrottle = 1
ConnectDelay = 1
AnonIPLimit = 100
MaxBufferSize = 500

<Listener l>
	Port = 6501
	IPv4 = true
	IPv6 = false
	SSL = false
</Listener>

<User tester1>
	Admin = true
	Nick = zncuser1
	AltNick = zncuser1_
	Ident = tester1
	RealName = Boson e2e ZNC user 1
	Buffer = 50
	AutoClearChanBuffer = true
	MaxNetworks = 10
	<Pass password>
		Method = plain
		Hash = pw
	</Pass>

	// controlpanel lets the suite's reset step drop channels left over
	// from earlier tests (DelChan) so the network starts empty.
	LoadModule = controlpanel

	<Network ergo>
		Server = ergo 6667
		IRCConnectEnabled = false
		JoinDelay = 0
		// ZNC rate-limits what it relays upstream (default 2 lines/s after
		// a burst of 9). The app's post-connect burst (CAP, WHO per
		// channel, MODE, JOIN…) would otherwise queue the test's JOIN and
		// PRIVMSG for many seconds.
		FloodRate = 100.00
		FloodBurst = 200
	</Network>
</User>

