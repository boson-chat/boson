# Ergo for client/tests/e2e-app/network-channels.spec.ts: a network where
# only admins create channels (auth `channel_creation: admins`, which the
# boson stack turns into Ergo's channels.operator-only-creation). Guests
# connect; JOIN of a channel that doesn't exist is refused with 403
# "Only server operators can create new channels" unless the client is an
# operator with the chanreg capability (the spec's peer OPERs as `admin` to
# make a channel that then exists for everyone). Throttles off as in
# ergo.yaml.
network:
  name: AdminsOnlyE2E

server:
  name: ergo3.e2e
  listeners:
    ":6667":
      tls:
        cert: ""
        key: ""
      proxy: false
  max-sendq: 96k
  ip-cloaking:
    enabled: false
  ip-limits:
    count: false
    throttle: false
  check-ident: false
  lookup-hostnames: false
  enforce-utf8: true

accounts:
  registration:
    enabled: false
  authentication-enabled: true
  require-sasl:
    enabled: false
  multiclient:
    enabled: false
  nick-reservation:
    enabled: false
  default-user-modes: ""
  login-throttling:
    enabled: false

channels:
  default-modes: ""
  operator-only-creation: true
  registration:
    enabled: false
  list-delay: 0s

oper-classes:
  "chanadmin":
    title: Channel admin
    capabilities: ["chanreg", "sajoin", "samode"]

opers:
  # OPER admin e2e-oper-pw (test-only; the stack is loopback + tmpfs).
  admin:
    class: "chanadmin"
    password: "$2a$04$apuBm0In/iJKhBgALfq7KuNyiEmTmk1RFVGQ8DvDQxpiQv7JEv8c2"

limits:
  nicklen: 32
  identlen: 20
  channellen: 64
  awaylen: 390
  kicklen: 390
  topiclen: 390
  monitor-entries: 100
  whowas-entries: 100
  chan-list-modes: 60
  registration-messages: 1024
  multiline:
    max-bytes: 4096
    max-lines: 100

fakelag:
  enabled: false

history:
  enabled: false

logging:
  - method: stderr
    level: info
    type: "* -userinput -useroutput"

datastore:
  path: /ircd/ircd.db
