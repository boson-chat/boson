# electron-builder config — used by `npm run build:installer` and by the
# release-client GitHub workflow on every v*.*.* tag. Output goes to
# client/dist/ as platform-native installers (the GitHub release uploader
# then attaches them to the just-published release).
#
# Code signing:
#   - macOS: Developer ID–signed + notarized when the release workflow has
#     the CSC_LINK / CSC_KEY_PASSWORD / APPLE_API_* secrets (see
#     .github/workflows/release-client.yml); otherwise ad-hoc signed by the
#     afterSign hook (first launch needs right-click → Open).
#   - Windows: ships unsigned. Users will see SmartScreen warnings.
#   - Linux: AppImage is self-contained, no signing concept.

appId: chat.boson.app
productName: Boson
copyright: Copyright © 2026 Boson

# Custom URL scheme handler. The marketing site's /discover page links
# to `boson://join?host=…&port=…&tls=…&name=…` for every server card;
# clicking one hands the URL to the installed app via the OS. Main
# process registers + parses the link in src/main/index.ts.
protocols:
  - name: Boson Chat Deep Link
    schemes:
      - boson

# electron-vite builds main + preload + renderer into out/.
# build/icon.png (1024×1024) is the app icon; electron-builder derives the
# macOS .icns and Windows .ico from it. Regenerate it from
# build/icon.source.html (headless Chrome screenshot, transparent bg).
directories:
  buildResources: build
  output: dist

# Bundle the built JS + node_modules production deps. electron-builder
# auto-detects which deps are runtime vs dev from package.json.
files:
  - out/**
  - package.json
  - "!**/.vite/**"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"

# Sidecar binaries — the IRC engine is a Go process that ships embedded
# in the app. resources/engine/ is populated by the release-client
# workflow ahead of `electron-builder` (see the "build engine sidecar"
# steps). At runtime, the main process picks the binary that matches
# process.platform + process.arch and spawns it as a child process.
extraResources:
  - from: resources/engine
    to: engine
    filter:
      - "**/*"

# Publish target for auto-update. electron-updater (running inside the
# packaged app) reads the matching latest*.yml metadata files this
# upload step writes alongside the .dmg / .exe / .AppImage / .zip,
# so the running app can find the newest release without us standing
# up a separate release server. GITHUB_TOKEN with `contents: write`
# in release-client.yml is sufficient — no extra auth.
publish:
  - provider: github
    owner: boson-chat
    repo: boson
    releaseType: release

# Ad-hoc sign the packaged macOS .app via scripts/mac-adhoc-sign.cjs when
# no Developer ID certificate is configured. electron-builder's own signing
# path doesn't understand `identity: '-'` (it treats the value as a keychain
# identity name and silently skips signing when the keychain doesn't have
# one), so unsigned builds are signed in this hook instead. The hook is a
# no-op for Developer ID builds (CSC_LINK set) and on Linux / Windows.
afterSign: scripts/mac-adhoc-sign.cjs

# Stable, version-less artifact names so the website can hard-link to
# /releases/latest/download/<file> and have those links keep working
# across every future release. The app still knows its own version
# (package.json → process.env.npm_package_version) so users can tell
# what they have from the in-app About panel.
mac:
  category: public.app-category.social-networking
  artifactName: Boson-mac-${arch}.${ext}
  target:
    # Two formats: dmg is the polished "drag to Applications" install
    # experience; zip is for users who hit the Gatekeeper "damaged" wall
    # and need a quick `xattr -cr` workaround path. electron-builder also
    # needs a zip alongside dmg if we ever turn on auto-update.
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Signing identity comes from CSC_LINK (a Developer ID Application
  # .p12) in the release workflow; without it electron-builder skips
  # signing and the afterSign hook ad-hoc signs instead. We intentionally
  # do NOT set `identity` here — electron-builder would look it up in the
  # keychain as an identity *name*.
  #
  # Hardened Runtime (required for notarization) with the minimal
  # entitlement set Electron needs; helpers inherit the same file.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # The Go engine sidecar lives in Contents/Resources/engine (extraResources),
  # outside the paths electron-builder signs by default. Notarization rejects
  # any unsigned or non-hardened Mach-O, so sign both arches explicitly.
  binaries:
    - Contents/Resources/engine/engine-darwin-arm64
    - Contents/Resources/engine/engine-darwin-amd64
  # Notarization is switched on per build by the release workflow
  # (`-c.mac.notarize=true`) only when the App Store Connect API key
  # secrets exist, so local and unsigned builds don't try to notarize.
  notarize: false

win:
  target:
    - target: nsis
      arch: [x64]

# NSIS uses its own artifactName key — `win.artifactName` won't apply.
nsis:
  artifactName: Boson-Setup.${ext}

linux:
  category: Network
  artifactName: Boson-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
